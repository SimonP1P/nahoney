<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unsere Flitterwochen 2028</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{--bg:#FBF7F1;--card:#fff;--ink:#22303A;--muted:#6A7782;--line:#ECE4D8;--sand:#F3EBDD;--shadow:0 10px 30px rgba(60,40,10,.10);--r:22px}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 Inter,system-ui,sans-serif}
img{display:block;max-width:100%}a{color:inherit}
h1,h2,h3{font-family:Fraunces,Georgia,serif;line-height:1.15;margin:0}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
/* Hero */
.hero{position:relative;min-height:92vh;display:grid;place-items:center;text-align:center;color:#fff;overflow:hidden}
.mosaic{position:absolute;inset:0;display:grid;grid-template-columns:repeat(5,1fr)}
.mosaic div{background-size:cover;background-position:center;filter:saturate(1.15) brightness(1.02)}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,0) 30%,rgba(20,30,40,.45))}
.hero .t{position:relative;z-index:2;padding:40px 20px}
.hero h1{font-size:clamp(42px,7vw,96px);font-weight:600;text-shadow:0 4px 30px rgba(0,0,0,.35)}
.hero p{font-size:clamp(17px,2vw,22px);margin:14px auto 28px;max-width:720px;text-shadow:0 2px 14px rgba(0,0,0,.4)}
.chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.chip{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:999px;background:rgba(255,255,255,.92);color:var(--ink);text-decoration:none;font-weight:600;box-shadow:var(--shadow)}
.dot{width:12px;height:12px;border-radius:50%}
/* Nav */
nav{position:sticky;top:0;z-index:50;background:rgba(251,247,241,.88);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
nav .wrap{display:flex;gap:8px;overflow:auto;padding:10px 20px}
nav a{white-space:nowrap;text-decoration:none;padding:7px 14px;border-radius:999px;font-weight:600;font-size:14px;color:var(--muted)}
nav a:hover{background:var(--sand);color:var(--ink)}
/* Vergleich */
section{padding:70px 0}.kicker{text-transform:uppercase;letter-spacing:.14em;font-size:12px;font-weight:600;color:var(--muted)}
.lead{color:var(--muted);max-width:760px}
.grid5{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:18px;margin-top:28px}
.ccard{background:var(--card);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);text-decoration:none;display:flex;flex-direction:column;transition:transform .25s}
.ccard:hover{transform:translateY(-6px)}
.ccard .img{aspect-ratio:4/3;background-size:cover;background-position:center}
.ccard .b{padding:16px 18px 20px;border-top:5px solid var(--c)}
.ccard h3{font-size:21px;margin:4px 0 6px}.ccard .m{font-size:14px;color:var(--muted)}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;background:var(--sand);font-size:13px;font-weight:600;margin:3px 4px 0 0}
table.cmp{width:100%;border-collapse:separate;border-spacing:0;margin-top:28px;background:#fff;border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);font-size:14px}
.cmp th,.cmp td{padding:12px 14px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.cmp th{background:var(--sand);font-weight:600}.tablewrap{overflow-x:auto}
/* Konzept */
.konzept{border-top:1px solid var(--line)}
.kbanner{position:relative;border-radius:28px;overflow:hidden;min-height:440px;display:flex;align-items:flex-end;box-shadow:var(--shadow);background-size:cover;background-position:center}
.kbanner:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 45%,rgba(0,0,0,.55))}
.kbanner .t{position:relative;z-index:2;color:#fff;padding:34px}
.kbanner .badge{display:inline-block;background:var(--c);color:#fff;font-weight:700;padding:6px 14px;border-radius:999px;margin-bottom:12px}
.kbanner h2{font-size:clamp(32px,4.5vw,56px)}.kbanner p{font-size:19px;max-width:700px;margin:10px 0 0}
.fav{position:absolute;top:20px;right:20px;z-index:3;border:0;background:rgba(255,255,255,.92);border-radius:999px;padding:10px 16px;font:600 15px Inter;cursor:pointer;box-shadow:var(--shadow)}
.fav.on{background:#ff4d6d;color:#fff}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin:26px 0}
.fact{background:#fff;border-radius:18px;padding:16px 18px;box-shadow:var(--shadow)}.fact .l{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}.fact .v{font-weight:600;margin-top:4px}
.two{display:grid;grid-template-columns:1.2fr 1fr;gap:22px;align-items:start}
@media(max-width:860px){.two{grid-template-columns:1fr}}
.map{height:420px;border-radius:var(--r);box-shadow:var(--shadow);z-index:1}
.panel{background:#fff;border-radius:var(--r);padding:22px 24px;box-shadow:var(--shadow)}
.panel h3{font-size:22px;margin-bottom:10px}.panel ul{margin:0;padding-left:18px}.panel li{margin:6px 0}
.station{border-left:4px solid var(--c);padding:4px 0 4px 14px;margin:14px 0}.station b{font-size:17px}
.station small{color:var(--muted)}
/* Tage */
.days{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:22px;margin-top:26px}
.day{background:#fff;border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column}
.day .ph{position:relative;aspect-ratio:3/2;background:linear-gradient(135deg,var(--c),#ffd29d);cursor:zoom-in}
.day .ph img{width:100%;height:100%;object-fit:cover}
.day .num{position:absolute;top:14px;left:14px;background:#fff;color:var(--ink);font:700 15px Inter;padding:6px 12px;border-radius:999px;box-shadow:0 4px 14px rgba(0,0,0,.15)}
.day .en{position:absolute;top:14px;right:14px;font:600 12px Inter;padding:5px 10px;border-radius:999px;background:rgba(255,255,255,.92)}
.day .b{padding:18px 20px 20px}.day .ort{font-size:13px;color:var(--c);font-weight:700;text-transform:uppercase;letter-spacing:.08em}
.day h4{font:600 20px Fraunces,serif;margin:4px 0 8px}.day p{margin:0 0 10px;color:#3a4650}
.day ul{margin:0 0 8px;padding-left:18px;font-size:14px}.tipp{font-size:14px;background:var(--sand);border-radius:12px;padding:8px 12px}
.credit{font-size:11px;color:#9aa3aa;padding:0 20px 12px}
.lc{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-top:22px}
.bars .row{display:grid;grid-template-columns:150px 1fr 140px;gap:10px;align-items:center;margin:8px 0;font-size:14px}
.bars .bar{height:12px;border-radius:999px;background:var(--sand);position:relative;overflow:hidden}
.bars .bar span{position:absolute;top:0;bottom:0;border-radius:999px;background:var(--c);opacity:.85}
details{margin-top:18px}summary{cursor:pointer;font-weight:600}
.quellen a{color:var(--muted);font-size:14px}
footer{padding:50px 0 70px;color:var(--muted);font-size:14px;text-align:center}
.lb{position:fixed;inset:0;background:rgba(10,15,20,.88);display:none;place-items:center;z-index:100;padding:30px;cursor:zoom-out}
.lb img{max-height:88vh;border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
</style></head><body>

<script>
const D=[{"id":"A","titel":"Dschungelvilla und autofreie Insel","untertitel":"Erst Frühstück am eigenen Pool über grünen Reisfeldern, dann barfuß auf einer Insel ohne Autos, mit Schildkröten vor dem Strand und der Sonne, die hinter Bali ins Meer sinkt.","farbe":"#1FB5A3","hero":{"url":"https://images.unsplash.com/photo-1587364125669-354c5735dd2d?w=1600&q=80","credit":"mtsjrdl, Unsplash License","quelle":"https://unsplash.com/photos/aerial-view-of-green-trees-and-body-of-water-during-daytime-9y5uMwQKJzc"},"eckdaten":{"monat":"Juni 2028","naechte":13,"budget_von":6700,"budget_bis":11600,"budget_mitte":8700,"ampel":"eng","anreise":"Hin: SQ325 Frankfurt 21:40 nach Singapur 16:05 am Folgetag (ca. 12,5 h, Nachtflug), 2 Nächte Stopover, dann SQ938 Singapur 09:15 nach Denpasar ca. 11:55. Zurück (Open-Jaw): Scoot TR259 Lombok ca. 17:25 nach Singapur, SQ26 Singapur 23:55 nach Frankfurt 06:40. Zeiten Stand 2026 (recherchiert, Quellen weichen ab), für 2028 offen. 13 Hotelnächte plus je eine Nacht im Flugzeug.","zeitverschiebung":"+6 h","stopover":"Singapur"},"stationen":[{"name":"Singapur","land":"Singapur","naechte":2,"lat":1.2856,"lon":103.8466,"unterkunft":"Stadthotel mit Pool, nah an Marina Bay oder Chinatown","beispiele":[{"name":"PARKROYAL COLLECTION Pickering","warum":"Hotel voller Pflanzen mit Pool über der Stadt, zentral zwischen Chinatown und Clarke Quay, ein grüner Auftakt","preis":"ca. 170 bis 300 €/Nacht laut Vergleichsportalen, Club-Zimmer ab 650 SGD offiziell (recherchiert, Mai 2026)","url":""},{"name":"Stadthotel mit Pool, Kategorie 4 bis 5 Sterne","warum":"Falls Pickering zu teuer ist: wichtig sind Pool und Nähe zur MRT, damit der Stopover entspannt bleibt","preis":"ca. 200 bis 350 €/Nacht (Schätzung)","url":""}]},{"name":"Ubud-Umland (Kelusa oder Sayan)","land":"Indonesien (Bali)","naechte":5,"lat":-8.4433,"lon":115.283,"unterkunft":"Villa mit eigenem Pool und Blick auf Reisfeld oder Dschungel, geschlossenes, klimatisiertes Schlafzimmer","beispiele":[{"name":"Asvara Villa Ubud (Kelusa)","warum":"Grand One Bedroom Rice Field View Villa mit Privatpool und Whirlpool, ruhig außerhalb des Zentrums, nur ca. 15 Min. nach Tegallalang (Schätzung)","preis":"ca. 110 bis 190 €/Nacht laut Momentaufnahmen (AU$185, Rp 3,83 Mio. im Juli) (recherchiert, 2026)","url":"https://whatsnewindonesia.com/bali/feature/hotel/experience-romantic-escape-asvara-villa-ubud-more-just-stay"},{"name":"Samsara Ubud","warum":"17 Villen, jede mit beheiztem eigenem Pool, Blick ins Tal, eher Boutique-Luxus für die Flitterwochen","preis":"ab ca. 230 bis 320 €/Nacht (270 bis 373 USD) (recherchiert, ab-Preis)","url":""},{"name":"Terra Sayan","warum":"Villa mit Privatpool und Reisfeldblick in Sayan, günstige Alternative","preis":"Momentaufnahme ca. 102 £/Nacht, Jahr unklar (recherchiert)","url":"https://www.expedia.co.uk/Ubud-Hotels-Terra-Sayan.h117384098.Hotel-Information"}]},{"name":"Gili Meno","land":"Indonesien (Lombok)","naechte":6,"lat":-8.35,"lon":116.057,"unterkunft":"Villa mit eigenem Pool, bevorzugt an der Westküste (Sonnenuntergang), nicht direkt am Salzsee","beispiele":[{"name":"Villa Palma Gili Meno","warum":"Privatpool, laut Inserat nur für Erwachsene, 9,6/10 aus 283 Bewertungen: Ruhe und Zweisamkeit","preis":"Preis offen","url":"https://www.gites.fr/gites_villa-palma-gili-meno---private-pool---adult-only_gili-meno_h5541830_en.htm"},{"name":"BASK Gili Meno","warum":"Die schickste Wahl der Insel: Villen mit eigenem Plunge-Pool und Terrasse, gut für den Abschluss der Flitterwochen","preis":"ca. 260 bis 400 €/Nacht (299 bis 351 USD, Juli 2025 ab 421 €) (recherchiert, Momentaufnahmen)","url":""},{"name":"ORA Resort Gili Meno","warum":"Jede Villa mit eigenem Pool, deutlich günstiger, dafür schlichter","preis":"ab ca. 65 €/Nacht (75 USD) (recherchiert, ab-Preis)","url":"https://www.oceanearthtravels.com/hotels-resorts/ora-resort-gili-meno"}]}],"wege":[{"von":"Frankfurt","nach":"Singapur","art":"Flug","dauer":"ca. 12,5 bis 13,5 h nonstop, über Nacht (recherchiert)"},{"von":"Flughafen Changi","nach":"Hotel Singapur","art":"Auto","dauer":"ca. 25 bis 30 Min. per Taxi (Schätzung)"},{"von":"Singapur","nach":"Denpasar (Bali)","art":"Flug","dauer":"ca. 2 h 40 (recherchiert)"},{"von":"Flughafen Denpasar","nach":"Ubud-Umland","art":"Auto","dauer":"ca. 1 bis 2 h mit privatem Fahrer, je nach Verkehr (Schätzung, Insel-Faustregel)"},{"von":"Ubud-Umland","nach":"Padangbai","art":"Auto","dauer":"ca. 1 bis 1,25 h (Schätzung)"},{"von":"Padangbai","nach":"Gili Meno","art":"Boot","dauer":"ca. 2 h, z. B. Gili Gili Fast Boat 10:00 bis 12:05 (recherchiert, Fahrpläne weichen ab)"},{"von":"Gili Meno","nach":"Teluk Nare (Lombok)","art":"Boot","dauer":"ca. 12 Min. im privaten Speedboot (recherchiert)"},{"von":"Teluk Nare","nach":"Flughafen Lombok","art":"Auto","dauer":"ca. 1,5 h (recherchiert)"},{"von":"Lombok","nach":"Singapur","art":"Flug","dauer":"ca. 2 h 50 bis 3 h 05 (recherchiert)"},{"von":"Singapur","nach":"Frankfurt","art":"Flug","dauer":"ca. 12 h 45, über Nacht (recherchiert)"}],"tage":[{"tag":1,"ort":"Frankfurt","titel":"Abflug in die Flitterwochen","energie":"mittel","text":"Ihr fahrt entspannt zum Flughafen Frankfurt. Um 21:40 startet der Nachtflug nach Singapur. Abendessen an Bord, dann Licht aus: Ihr verschlaft den größten Teil der Strecke. Für Liz ist das der beste Einstieg in die erste Langstrecke, denn wenn sie aufwacht, ist schon fast Asien.","highlights":["Nachtflug mit Singapore Airlines","Ankunft am nächsten Nachmittag"],"tipp":"Sitzplätze früh reservieren, am besten eine Zweierreihe am Fenster, falls das Flugzeug welche hat. Für Liz hilft ein Platz über der Tragfläche, dort spürt man Turbulenzen weniger (Faustwissen).","bild":{"url":"https://images.unsplash.com/photo-1759784839707-a32c910a7747?w=1600&q=80","credit":"Benjamin Lehman, Unsplash License","quelle":"https://unsplash.com/photos/airplane-wing-seen-through-window-above-clouds-gYe2GTSKlk0"}},{"tag":2,"ort":"Singapur","titel":"Landen unter dem Wasserfall","energie":"ruhig","text":"Landung gegen 16 Uhr. Der erste Weg führt durch das Jewel direkt am Flughafen: Der Rain Vortex stürzt mitten in einem Glas-Dschungel herab. Danach Check-in, duschen, Pool. Am Abend spaziert ihr zu den Supertrees in Gardens by the Bay und schaut die Lichtshow, dann geht es früh ins Bett.","highlights":["Rain Vortex im Jewel Changi","Supertrees bei Nacht"],"tipp":"Die SG Arrival Card muss vor der Landung online ausgefüllt sein. Die Uhrzeiten der Lichtshow vorher prüfen (Annahme: zwei Shows am Abend).","bild":{"url":"https://images.unsplash.com/photo-1765886177901-dc0660c078b7?w=1600&q=80","credit":"Cai Fang, Unsplash License","quelle":"https://unsplash.com/photos/indoor-waterfall-surrounded-by-lush-greenery-and-modern-architecture--IuJKPEdtV4"}},{"tag":3,"ort":"Singapur","titel":"Gartenstadt und Garküche","energie":"mittel","text":"Ihr schlaft aus und frühstückt spät. Am Vormittag besucht ihr Cloud Forest und Flower Dome: kühl, grün, ein Wasserfall unter Glas, keine Insekten. Am Nachmittag ist Pool und Siesta gegen den Jetlag dran. Abends sucht ihr euch ein Hawker Centre oder eine Rooftop-Bar mit Blick auf Marina Bay, mild essen geht leicht mit Hainanese Chicken Rice.","highlights":["Cloud Forest und Flower Dome","Hainanese Chicken Rice, mild und berühmt","Sonnenuntergang über Marina Bay"],"tipp":"Die Domes unter der Woche am Vormittag besuchen, dann ist es dort am leersten (Schätzung).","bild":{"url":"https://images.unsplash.com/photo-1752854061807-9418649b035a?w=1600&q=80","credit":"Hanna Lazar, Unsplash License","quelle":"https://unsplash.com/photos/supertrees-at-gardens-by-the-bay-in-singapore-f-Wzz9Oq5A4"}},{"tag":4,"ort":"Ubud-Umland","titel":"Ankommen in der Dschungelvilla","energie":"ruhig","text":"Ein kurzer Morgenflug nach Bali, dort wartet euer Fahrer. Gegen 14 Uhr seid ihr in der Villa: eigener Pool, Reisfeld vor der Tür, Grillenkonzert statt Großstadt. Heute geht es nicht weiter als bis zur Liege und zum Abendessen in der Villa.","highlights":["Erster Sprung in den eigenen Pool","Willkommens-Dinner in der Villa"],"tipp":"Das ist einer von höchstens zwei frühen Starts (Abfahrt am Hotel ca. 07:00). Wer später will: Scoot TR288 um 10:15 (recherchiert), dann kostet aber das Gepäck extra.","bild":{"url":"https://images.unsplash.com/photo-1524882343900-7fabca41cd25?w=1600&q=80","credit":"Artem Beliaikin, Unsplash License","quelle":"https://unsplash.com/photos/woman-in-infinity-pool-with-overlooking-view-of-trees-2Q_dxabZm_I"}},{"tag":5,"ort":"Ubud-Umland","titel":"Reisterrassen und Wassertempel","energie":"aktiv","text":"Euer Fahrer holt euch um 8 Uhr ab. Um Viertel nach acht steht ihr in den Reisterrassen von Tegallalang, bevor die Busse kommen. Weiter geht es zum Wassertempel Gunung Kawi Sebatu mit Karpfenteichen und Moos, deutlich ruhiger als Tirta Empul. Mittagessen mit Blick ins Grüne, am Nachmittag seid ihr zurück am Pool.","highlights":["Tegallalang vor dem Andrang","Tempel Gunung Kawi Sebatu","Lunch mit Reisfeldblick"],"tipp":"Für Tempel braucht ihr Sarong und bedeckte Schultern. Oft werden Sarongs am Eingang verliehen (Annahme), ein eigener ist aber ein schönes Souvenir.","bild":{"url":"https://images.unsplash.com/photo-1513415756790-2ac1db1297d0?w=1600&q=80","credit":"Jason Cooper, Unsplash License","quelle":"https://unsplash.com/photos/aerial-photography-of-rice-terraces-during-daytime-XEhchWQuWyM"}},{"tag":6,"ort":"Ubud-Umland","titel":"Frühstück im Pool, Massage zu zweit","energie":"ruhig","text":"Heute ist ein Muss-Moment dran: Das Frühstück schwimmt auf einem Tablett im eigenen Pool, rundherum nur Grün. Danach gibt es nichts mehr, was ihr müsst. Am Nachmittag eine zweistündige balinesische Paarmassage, abends Kerzen auf der Terrasse.","highlights":["Floating Breakfast mit Grünblick","Paarmassage","Nichts tun"],"tipp":"Das schwimmende Frühstück am Vorabend bestellen und ausdrücklich nach später Uhrzeit fragen.","bild":{"url":"https://images.unsplash.com/photo-1756115374220-c43b04be3a53?w=1600&q=80","credit":"Ann Kolisnyk, Unsplash License","quelle":"https://unsplash.com/photos/floating-breakfast-tray-with-food-and-drinks-in-pool-797NfqTtx08"}},{"tag":7,"ort":"Ubud-Umland","titel":"Markt und Kochkurs","energie":"mittel","text":"Der Vormittag gehört einem Kochkurs mit Marktbesuch: Ihr riecht Kurkuma und Zitronengras, probiert Früchte, die ihr nicht kennt, und kocht danach Gado-Gado und Bebek-Gerichte, alles ohne Schärfe. Am Nachmittag ist Siesta. Abends bummelt ihr durch Ubud zum Saraswati-Tempel mit Lotusteich und esst ein Dinner im Ort.","highlights":["Morgenmarkt","Balinesisch kochen, mild","Saraswati-Tempel am Abend"],"tipp":"Bei der Buchung sagen: \"tidak pedas\", also nicht scharf. Kurse mit eigenem Garten oder auf einer Farm sind ruhiger als die im Zentrum (Schätzung).","bild":{"url":"https://images.unsplash.com/photo-1638446081329-aa6003de5800?w=1600&q=80","credit":"Nita Payne, Unsplash License","quelle":"https://unsplash.com/photos/4kymbla9ZIw"}},{"tag":8,"ort":"Ubud-Umland","titel":"Wasserfall und Goldene Stunde","energie":"mittel","text":"Gegen halb zehn seid ihr am Tibumana-Wasserfall: ein einzelner Fall in einer grünen Schlucht, viel ruhiger als Tegenungan. Mittags ist Poolzeit. Um 17 Uhr geht ihr den Campuhan Ridge Walk im warmen Abendlicht, ein flacher Grat zwischen Palmen. Danach gibt es das Abschiedsdinner in Ubud.","highlights":["Tibumana-Wasserfall","Campuhan Ridge Walk zur Goldenen Stunde","Abschiedsdinner"],"tipp":"Wasserschuhe mitnehmen. Zum Wasserfall führen Treppen, ca. 10 bis 15 Min. pro Weg (Schätzung).","bild":{"url":"https://images.unsplash.com/photo-1561271484-3a69b8e31344?w=1600&q=80","credit":"Jared Rice, Unsplash License (Motivbild Dschungel-Wasserfall)","quelle":"https://unsplash.com/photos/woman-standing-near-waterfall-during-daytime-WbOn78k-ywU"}},{"tag":9,"ort":"Gili Meno","titel":"Übersetzen auf die Barfuß-Insel","energie":"mittel","text":"Um 8:30 holt euch der Fahrer ab und bringt euch nach Padangbai. Um 10 Uhr legt das Schnellboot ab, kurz nach Mittag watet ihr auf Gili Meno an Land. Hier gibt es keine Autos und keine Roller, nur Sand, Räder und Türkis. Ihr bezieht die Villa und seht abends den ersten Sonnenuntergang an der Westküste.","highlights":["Schnellboot durch die Lombok-Straße","Ankunft ohne Autolärm","Erster Sonnenuntergang"],"tipp":"Liz nimmt eine Stunde vorher Reisetabletten und setzt sich hinten ins Boot. Gepäck kommt per Träger oder Handwagen. Bitte keine Pferdekutschen (Cidomo), die Tiere arbeiten unter schlechten Bedingungen.","bild":{"url":"https://images.unsplash.com/photo-1724287549821-2a7cb5a873a0?w=1600&q=80","credit":"Sayid Habib Ismail, Unsplash License","quelle":"https://unsplash.com/photos/a-dock-with-a-boat-in-the-water-tmaxhAycOlg"}},{"tag":10,"ort":"Gili Meno","titel":"Schnorcheln mit Schildkröten","energie":"mittel","text":"Nach einem späten Frühstück schnorchelt ihr direkt vom Strand los. Vor Gili Meno grasen Meeresschildkröten in Seegraswiesen und am Riff, oft nur ein paar Meter entfernt. Mit einem Guide findet ihr auch die Unterwasser-Skulpturen vor der Westküste. Am Nachmittag sind Hängematte und Pool dran.","highlights":["Schildkröten vom Strand aus","Unterwasser-Skulpturen (Annahme: vor der Westküste)","Hängematte"],"tipp":"Abstand halten, nicht anfassen. Riffschonende Sonnencreme und Lycra-Shirts nehmen. Morgens ist das Wasser meist ruhiger (Annahme).","bild":{"url":"https://images.unsplash.com/photo-1718357168158-d2dc91212786?w=1600&q=80","credit":"Narno Beats, Unsplash License","quelle":"https://unsplash.com/photos/a-sea-turtle-swimming-over-a-coral-reef-1x9Z5RcZ4bY"}},{"tag":11,"ort":"Gili Meno","titel":"Ein Tag für niemanden","energie":"ruhig","text":"Ihr legt euch unter eine Palme an einen weißen Strand, lest, schwimmt und schlaft. Am Nachmittag gibt es Spa mit Frangipani-Bad. Abends esst ihr frischen Fisch vom Grill, mild gewürzt, die Füße im Sand.","highlights":["Strandtag ohne Plan","Spa-Nachmittag","Fisch vom Grill"],"tipp":"","bild":{"url":"https://images.unsplash.com/photo-1724287549833-39643ec84ffe?w=1600&q=80","credit":"Sayid Habib Ismail, Unsplash License","quelle":"https://unsplash.com/photos/a-sandy-beach-next-to-the-ocean-under-a-blue-sky-uBATUuwZC-I"}},{"tag":12,"ort":"Gili Meno","titel":"Drei Inseln mit dem eigenen Boot","energie":"aktiv","text":"Statt im vollen Glasbodenboot fahrt ihr mit einem privaten Boot für einen halben Tag zu den Schnorchelplätzen zwischen Gili Meno, Gili Air und Gili Trawangan. Mittagessen gibt es am Strand von Gili Air, dann geht es zurück, bevor es heiß wird. Die Partyinsel Trawangan seht ihr nur vom Wasser aus.","highlights":["Privates Boot","Schnorchelspots der drei Gilis","Lunch auf Gili Air"],"tipp":"Boot über die Villa buchen und um ca. 9:30 abfahren. Preis vorher fest vereinbaren, inklusive Ausrüstung (Annahme).","bild":{"url":"https://images.unsplash.com/photo-1583022846753-83a4eba54ac1?w=1600&q=80","credit":"Tom Bixler, Unsplash License","quelle":"https://unsplash.com/photos/aerial-view-of-boats-on-sea-during-daytime-9CAa-_XbD6I"}},{"tag":13,"ort":"Gili Meno","titel":"Vulkan-Sonnenaufgang ohne Wecker um drei","energie":"ruhig","text":"Ein freiwilliger früher Start: Ihr geht fünf Minuten an die Ostküste und seht die Sonne hinter Lombok und dem Rinjani aufgehen (Annahme: freier Blick bei klarer Luft), dann geht es zurück ins Bett. Am späten Nachmittag fahrt ihr mit dem Rad auf Sandwegen einmal um die Insel, ca. 1 Stunde (Schätzung), mit Stopp für eine Kokosnuss.","highlights":["Sonnenaufgang über dem Rinjani","Radrunde um die Insel","Kokosnuss am Weg"],"tipp":"Der Sonnenaufgang ist im Juni gegen 6:30 (Schätzung). Den Salzsee in der Inselmitte in der Dämmerung meiden, dort gibt es mehr Mücken (Annahme).","bild":{"url":"https://images.unsplash.com/photo-1726197498023-a2b55a70fa25?w=1600&q=80","credit":"Sayid Habib Ismail, Unsplash License","quelle":"https://unsplash.com/photos/a-couple-of-people-riding-bikes-down-a-dirt-road-vtrG_nkEtbc"}},{"tag":14,"ort":"Gili Meno","titel":"Dinner am leeren Strand bei Sonnenuntergang","energie":"ruhig","text":"Der zweite Muss-Moment: Am Abend steht ein gedeckter Tisch nur für euch zwei am Westufer, mit Laternen und Blüten. Die Sonne geht hinter Bali und dem Agung unter (Annahme: bei klarer Sicht). Tagsüber schnorchelt ihr ein letztes Mal und hängt am Pool ab.","highlights":["Privates Sonnenuntergangs-Dinner am Strand","Letzter Schnorchelgang","Blick auf den Agung"],"tipp":"Bei der Villa schon bei der Buchung reservieren und Tag 9 oder 13 als Ausweichabend vereinbaren. Kosten ca. 150 bis 250 € für zwei (Schätzung).","bild":{"url":"https://images.unsplash.com/photo-1764397576341-30ccea0109c4?w=1600&q=80","credit":"Tomi Saputra, Unsplash License","quelle":"https://unsplash.com/photos/HIaJ9irAEp4"}},{"tag":15,"ort":"Gili Meno, Lombok, Singapur","titel":"Langsamer Abschied über Lombok","energie":"mittel","text":"Ihr habt einen langen Morgen mit Frühstück, einem letzten Bad und spätem Check-out. Gegen 13:30 bringt euch ein Speedboot in 12 Minuten nach Lombok, dann fahrt ihr anderthalb Stunden zum Flughafen. Um ca. 17:25 fliegt ihr nach Singapur, dort habt ihr gut drei Stunden zum Umsteigen und Abendessen, um 23:55 geht der Nachtflug nach Hause.","highlights":["Letzter Morgen am Meer","Kein Bootsritt zurück nach Bali","Nachtflug nach Hause"],"tipp":"Alles auf einem Ticket buchen, damit der Anschluss geschützt ist und das Gepäck durchgeht (offen, ob SQ den Scoot-Flug mitverkauft). Den Tag mit dem 17:25-Abflug wählen, nicht den mit 18:55.","bild":{"url":"https://images.unsplash.com/photo-1724287549835-55437984f4cd?w=1600&q=80","credit":"Sayid Habib Ismail, Unsplash License","quelle":"https://unsplash.com/photos/a-beach-that-has-a-boat-in-the-water-avGMFjFhrDs"}},{"tag":16,"ort":"Frankfurt","titel":"Zuhause, verheiratet und braun","energie":"ruhig","text":"Landung um 06:40 in Frankfurt, dann mit dem Zug nach Hause. Den Rest des Tages verbringt ihr auf dem Sofa, mit Fotos und ohne Termine.","highlights":["Morgens zuhause","Fotos sortieren"],"tipp":"Nach der Ankunft einen Puffertag ohne Arbeit einplanen, der Jetlag wirkt Richtung Westen milder (Faustwissen).","bild":{"url":"https://images.unsplash.com/photo-1756744090160-bef8ead0ad1c?w=1600&q=80","credit":"Cody F, Unsplash License","quelle":"https://unsplash.com/photos/a-white-airplane-flying-in-a-clear-blue-sky-uSo3Vq1aQkQ"}}],"warum_ihr":["Frühstück am eigenen Pool mit Grünblick: In einer Ubud-Villa ist das der Normalfall und kein Luxus-Extra, als schwimmendes Frühstück an Tag 6 gesetzt.","Einsamer Strand mit Dinner bei Sonnenuntergang: Die Westküste von Gili Meno schaut Richtung Bali, das private Dinner an Tag 14 hat einen Ausweichabend.","Wasserfall, Reisterrassen, Tempel, Markt, Kochkurs und Schildkröten sind alle drin, verteilt auf aktive Tage mit faulen Tagen dazwischen.","Vulkan-Sonnenaufgang für Spättypen: fünf Minuten zu Fuß statt Abholung um 2 Uhr am Batur. Insgesamt gibt es nur zwei frühe Starts.","Für Liz: Singapur als sanfter, sauberer Zwischenstopp, eine Insel ohne Autos und ohne Partyszene, viel Spa, Märkte und Fotomotive.","Dank Open-Jaw über Lombok gibt es keine Rückfahrt mit dem Schnellboot, der letzte Tag beginnt mit einem langsamen Morgen am Meer."],"liz_check":{"langstrecke":"Zweimal Nachtflug von ca. 12,5 bis 13 h, beide Male geteilt: hin mit zwei Nächten Pause in Singapur, zurück mit einem kurzen Zubringer von ca. 3 h. Wenn das Budget es hergibt, Premium Economy für den Hinflug prüfen (offen, Aufpreis nicht recherchiert).","insekten":"Dengue gibt es ganzjährig, Malaria nur mit geringem Risiko, 2025/26 gab es Zika-Fälle bei Rückkehrern (recherchiert, AA). Die Trockenzeit hilft. Nur Villen mit geschlossenem, klimatisiertem Schlafzimmer und Moskitonetz, keine offene Dschungelhütte. Auf Gili Meno nicht am Salzsee wohnen (Annahme). Singapur ist kaum ein Thema.","essen":"Sambal kommt meist separat. \"Tidak pedas\" heißt nicht scharf (Faustwissen). Im Kochkurs bestimmt ihr die Schärfe selbst. In Singapur gibt es mit Chicken Rice und Dim Sum milde Klassiker.","trubel":"Ihr wohnt außerhalb des Ubud-Zentrums, Tegallalang besucht ihr um 8:15, statt Tirta Empul und Tegenungan gibt es die ruhigeren Gunung Kawi Sebatu und Tibumana. Ihr wohnt auf Gili Meno statt Trawangan und nehmt ein privates Boot statt Gruppentour. Der Juni liegt noch vor den Sommerferien."},"wetter":{"juni":"Trockenzeit auf Bali und den Gilis: an der Küste ca. 30/22 °C, in Ubud 24 bis 29 °C, Meer ca. 28 °C, 4 bis 5 Regentage, meist kurze Schauer (recherchiert, Quellen weichen ab). Singapur ist schwül bei ca. 31/25 °C, ein Gewitter ist jederzeit möglich (Schätzung).","juli":"Ähnlich trocken, 2 bis 3 Regentage, Meer ca. 27 °C. Ab dem 10.07. sind Sommerferien in NRW, es beginnt die Hochsaison: volle Spots, Villen früher ausgebucht und teurer (recherchiert, Preiseffekt Schätzung).","august":"Der trockenste Monat in Ubud, Meer ca. 26 bis 27 °C, Hochsaison auf dem Höhepunkt. Am 17.08. ist Nationalfeiertag (Annahme). Stärkerer Südostwind kann die Bootsfahrten ruppiger machen (Annahme)."},"einreise_gesundheit":["Annahme: beide reisen mit deutschem Reisepass. Im Board steht dazu nichts, für Liz ist es offen. Der Pass sollte bei Einreise noch mindestens 6 Monate gültig sein (Annahme, beim AA prüfen).","Singapur: als Tourist visumfrei (Annahme, AA prüfen). Die SG Arrival Card muss vor der Ankunft online eingereicht werden, sie gilt für alle Reisenden (recherchiert, ICA).","Indonesien: e-VOA für 500.000 IDR p. P. (ca. 24 €), digitale Ankunftskarte \"All Indonesia\" bis 72 h vorher, Bali-Abgabe 150.000 IDR p. P. (ca. 7 €) (recherchiert, AA, Stand 2026-11-07; Kurs 1 € ≈ 20.450 IDR, Stand 2026-11-04).","Rückflug ab Lombok mit Umstieg in Singapur: ohne Einreise nur, wenn alles auf einem Ticket steht und das Gepäck durchgecheckt wird (offen).","Gesundheit: Dengue, geringes Malaria-Risiko und Zika (recherchiert, AA). Impfberatung beim Tropeninstitut oder Hausarzt 6 bis 8 Wochen vor Abflug. Nur abgefülltes Wasser trinken. Mückenschutz und Impfungen klärt die Rolle Gesundheit.","Vor der Reise die AA-Hinweise erneut prüfen: Vulkanasche (Lewotobi, Rinjani) kann Flüge in Bali und Lombok stören, zuletzt bekannt aus 2024/25, nicht neu geprüft."],"budget_posten":[{"posten":"Flüge (Open-Jaw FRA-SIN-DPS, LOP-SIN-FRA, Economy, inkl. 6 % Preissteigerung)","von":2000,"bis":2850},{"posten":"Unterkunft (2 Nächte Singapur, 5 Nächte Villa Ubud, 6 Nächte Villa Gili Meno, inkl. 6 %)","von":2200,"bis":4370},{"posten":"Essen und Getränke","von":750,"bis":1300},{"posten":"Transport vor Ort (Fahrer, Schnellboot, Speedboot, Taxis)","von":370,"bis":600},{"posten":"Aktivitäten und Spa (Kochkurs, privates Boot, Massagen, Domes, Strand-Dinner)","von":530,"bis":1000},{"posten":"Gebühren (e-VOA, Bali-Abgabe, Eintritte Tempel)","von":70,"bis":90},{"posten":"Reiseversicherung (Rücktritt, Abbruch, Kranken)","von":200,"bis":350},{"posten":"Puffer 10 %","von":610,"bis":1060}],"risiken":[{"risiko":"Villen mit Privatpool und Strand-Dinner sind ausgebucht oder teurer als gedacht, weil Bali auch im Juni beliebt ist.","gegenmassnahme":"Ca. 9 bis 12 Monate vorher buchen (Sommer 2027), nur mit kostenloser Stornierung. Sparhebel: Gili Meno mit Villa Palma oder ORA statt BASK spart ca. 600 bis 1.200 €, Singapur in einem Hotel der Mittelklasse ca. 150 bis 250 € (Schätzung)."},{"risiko":"Das Schnellboot Padangbai–Gili Meno fällt bei Wellengang aus oder ist für Liz unangenehm. Das AA warnt allgemein vor Bootsunfällen.","gegenmassnahme":"Einen etablierten Anbieter wählen und am Vormittag fahren, Reisetabletten nehmen. Plan B: Inlandsflug Denpasar–Lombok, dann Auto und 12 Min. Speedboot ab Teluk Nare."},{"risiko":"Der Anschluss Lombok–Singapur–Frankfurt platzt, weil Scoot verspätet ist oder auf einem Extra-Ticket steht.","gegenmassnahme":"Alles auf einem Ticket buchen, den Tag mit dem 17:25-Abflug wählen. Geht das nicht, die letzte Nacht in Singapur verbringen (+1 Hotelnacht, dafür ein Gili-Tag weniger)."},{"risiko":"Bali ist im Sommer das vollste der Konzepte. Bali-Gefühl und wenig Trubel ziehen gegeneinander (stärkstes Gegenargument).","gegenmassnahme":"Außerhalb wohnen, die Spots vor 9 Uhr oder ruhigere Alternativen besuchen, Gili Meno statt Trawangan, privates Boot statt Gruppentour."}],"plan_b":"Wetterabhängig sind das Strand-Dinner, das Schnorcheln und der Sonnenaufgang. Das Dinner bekommt einen Ausweichabend (Tag 9 oder 13). Bei Wellen tauscht ihr Schnorchel- und Bootstag (Tag 10 und 12) gegen Spa und Strand. Der Sonnenaufgang ist freiwillig und lässt sich jeden Morgen nachholen. Fällt das Schnellboot aus, fliegt ihr kurz von Denpasar nach Lombok. Brennt Bali als Ganzes durch (Vulkanasche, Sicherheitslage), bleibt Singapur als Drehkreuz und die Malediven oder Langkawi sind als Ausweichziele mit gleicher Anreise erreichbar (Annahme, nicht geprüft).","quellen":[{"titel":"Auswärtiges Amt: Indonesien, Reise- und Sicherheitshinweise","url":"https://www.auswaertiges-amt.de/de/service/laender/indonesien-node/indonesiensicherheit-212396","stand":"2026-11-07"},{"titel":"ICA Singapur: SG Arrival Card","url":"https://www.ica.gov.sg","stand":"2026-11-07"},{"titel":"Airportoverview: Flüge Frankfurt–Singapur","url":"https://www.airportoverview.com/routes/FRA/SIN","stand":"2026-11-07"},{"titel":"Check24: Flüge Frankfurt–Denpasar","url":"https://flug.check24.de/fluege/denpasar/frankfurt-denpasar","stand":"2026-11-07"},{"titel":"Traveloka: Flüge Singapur–Denpasar (Abflugzeiten)","url":"https://www.traveloka.com/en-sg/flight/route/Singapore-Bali-Denpasar.SIN.DPS","stand":"2026-11-07"},{"titel":"flight.info: Scoot TR288 Singapur–Denpasar","url":"https://www.flight.info/TR288","stand":"2026-11-07"},{"titel":"Scoot erhöht Singapur–Lombok auf bis zu 10 Flüge pro Woche (bezahlte Meldung)","url":"https://smb.americanpress.com/article/Scoot-Raises-Singapore-Lombok-Flights-to-10-Weekly/6a282568dc108e0002504a24","stand":"2026-11-07"},{"titel":"Klimatabelle Bali","url":"https://www.klimatabelle.info/asien/indonesien/bali","stand":"2026-11-07"},{"titel":"Wassertemperatur Bali","url":"https://wassertemperatur.org/bali","stand":"2026-11-07"},{"titel":"Weatherspark: Wetter in Ubud","url":"https://weatherspark.com/y/128807/Average-Weather-in-Ubud-Indonesia-Year-Round","stand":"2026-11-07"},{"titel":"What's New Indonesia: Asvara Villa Ubud","url":"https://whatsnewindonesia.com/bali/feature/hotel/experience-romantic-escape-asvara-villa-ubud-more-just-stay","stand":"2026-11-07"},{"titel":"Expedia: Terra Sayan","url":"https://www.expedia.co.uk/Ubud-Hotels-Terra-Sayan.h117384098.Hotel-Information","stand":"2026-11-07"},{"titel":"Ocean Earth Travels: ORA Resort Gili Meno","url":"https://www.oceanearthtravels.com/hotels-resorts/ora-resort-gili-meno","stand":"2026-11-07"},{"titel":"Gites: Villa Palma Gili Meno","url":"https://www.gites.fr/gites_villa-palma-gili-meno---private-pool---adult-only_gili-meno_h5541830_en.htm","stand":"2026-11-07"},{"titel":"Unsplash: Bildquellen je Tag (Fotoseiten siehe Feld bild.quelle)","url":"https://unsplash.com","stand":"2026-11-07"}]},{"id":"B","titel":"Zwei Buchten im Golf von Thailand","untertitel":"Morgens Frühstück im eigenen Pool über grünen Hängen, abends barfuß im warmen Sand, während die Sonne hinter den Inseln versinkt, und zum Schluss die goldenen Tempel von Bangkok.","farbe":"#2AA9D6","hero":{"url":"https://images.unsplash.com/photo-1775476764290-7b9af9d4cab6?w=1600&q=80","credit":"Seongjin Park, Unsplash License","quelle":"https://unsplash.com/photos/w4c3iyofCuo"},"eckdaten":{"monat":"Juni 2028","naechte":13,"budget_von":6700,"budget_bis":12700,"budget_mitte":8900,"ampel":"eng","anreise":"Hin: Thai Airways TG921 Frankfurt ca. 13:45 bis 14:45 nonstop nach Bangkok, Ankunft ca. 06:25 am Folgetag, ca. 10,5 bis 11 h (recherchiert, Flugplan 2026). Dann Bangkok Airways nach Koh Samui, ca. 1:05 bis 1:20 h (recherchiert). Zurück: Samui nach Bangkok, 2 Nächte Stadt, dann Nachtflug TG920 nonstop nach Frankfurt, Ankunft früh morgens (Schätzung, Zeit 2026 nicht gefunden). Ein Umstieg je Richtung, 13 Hotelnächte plus je eine Nacht im Flugzeug. Zeiten für 2028 offen. Alternativen ab Düsseldorf oder Amsterdam: offen.","zeitverschiebung":"+5 h","stopover":"Bangkok (am Ende)"},"stationen":[{"name":"Koh Samui, Westküste (Taling Ngam)","land":"Thailand","naechte":6,"lat":9.4288,"lon":99.933,"unterkunft":"Villa mit eigenem Pool am Hang, Blick über Grün aufs Meer, Balkon nach Westen zum Sonnenuntergang","beispiele":[{"name":"InterContinental Koh Samui Resort","warum":"Villen mit Privatpool am grünen Hang der ruhigen Südwestküste, alle Einheiten mit Balkon zum Sonnenuntergang; ideal für das erste Pool-Frühstück und den leeren Strand am Abend","preis":"Poolvilla ca. 400 bis 550 €/Nacht (Schätzung; Portal: ab 450 USD ohne Steuern, Stand 12/2025, recherchiert)","url":"https://samui.intercontinental.com/rooms-suites"},{"name":"Avani+ Samui Resort","warum":"Sparvariante in derselben ruhigen Ecke von Taling Ngam: Pool Villa mit eigenem Pool und kleinem Deck, Balkone auf den Sonnenuntergang ausgerichtet","preis":"Hotel-Durchschnitt ca. 130 bis 175 €/Nacht (recherchiert, Momondo, undatiert); Poolvilla ca. 200 bis 300 € (Schätzung)","url":""},{"name":"Conrad Koh Samui","warum":"Luxus-Variante am Südwesthang über dem Meer, Villen mit Privatpool (Annahme, Kategorie prüfen), sehr abgeschieden","preis":"ab ca. 640 USD, ca. 550 €/Nacht, für den 01.06.2026 (recherchiert, Expedia Stand 05/2026, ab-Preis)","url":""}]},{"name":"Koh Phangan, Thong Nai Pan Noi","land":"Thailand","naechte":5,"lat":9.7905,"lon":100.07,"unterkunft":"Poolvilla oder Pool-Suite in der stillen Nordost-Bucht zwischen Dschungelhügeln","beispiele":[{"name":"Santhiya Koh Phangan Resort & Spa","warum":"Poolvillen am Dschungelhang mit Meerblick, eigener Pier mit Speedboot ab Samui, ruhige Bucht weit weg vom Partystrand","preis":"Durchschnitt laut Portalen 165 bis 237 USD, ca. 145 bis 205 €/Nacht (recherchiert, undatiert); Poolvilla eher 220 bis 350 € (Schätzung)","url":"https://kohphangan.santhiya.com"},{"name":"Anantara Rasananda Koh Phangan Villas","warum":"Jede Kategorie hat einen eigenen Pool, direkt am Strand. Die Garden Pool Suite liegt hinter hohen Mauern und ist sehr privat, die Ocean Pool Suite hat Blick auf Meer und Garten (recherchiert)","preis":"ab 1.057 AED, ca. 250 €/Nacht ohne Steuern, für den 19.06.2026 (recherchiert, Expedia Stand 05/2026, ab-Preis)","url":"https://www.mrandmrssmith.com/luxury-hotels/anantara-rasananda/rooms"}]},{"name":"Bangkok, am Chao Phraya","land":"Thailand","naechte":2,"lat":13.7066,"lon":100.4915,"unterkunft":"Flusshotel mit Pool auf dem Dach, Late-Checkout am Abreisetag","beispiele":[{"name":"Avani+ Riverside Bangkok","warum":"Infinity-Pool auf dem Dach über dem Fluss, guter Ausgangspunkt für Tempel per Boot","preis":"ca. 70 bis 215 €/Nacht, Durchschnitt ca. 215 € (recherchiert, Portal Stand 05/2026)","url":""},{"name":"Flusshotel mit Pool, 4 bis 5 Sterne","warum":"Wichtig sind Lage am Chao Phraya, ein Pool zum Abkühlen und ein Late-Checkout bis zum Nachtflug","preis":"ca. 120 bis 250 €/Nacht (Schätzung)","url":""}]}],"wege":[{"von":"Frankfurt","nach":"Bangkok","art":"Flug","dauer":"ca. 10,5 bis 11 h nonstop (recherchiert)"},{"von":"Bangkok","nach":"Koh Samui","art":"Flug","dauer":"ca. 1:05 bis 1:20 h, dazu 2,5 bis 3 h Umsteigezeit (recherchiert, Umsteigezeit Empfehlung)"},{"von":"Flughafen Samui","nach":"Taling Ngam","art":"Auto","dauer":"ca. 50 bis 75 Min. (Schätzung)"},{"von":"Taling Ngam","nach":"Pier im Norden Samuis","art":"Auto","dauer":"ca. 45 bis 60 Min. (Schätzung)"},{"von":"Koh Samui","nach":"Thong Nai Pan Noi","art":"Boot","dauer":"ca. 45 bis 60 Min. per Speedboot (Schätzung)"},{"von":"Thong Nai Pan Noi","nach":"Koh Samui, Flughafen","art":"Boot","dauer":"ca. 1 bis 1,5 h Boot plus Auto (Schätzung)"},{"von":"Koh Samui","nach":"Bangkok","art":"Flug","dauer":"ca. 1:05 bis 1:20 h (recherchiert); Tür zu Tür ca. 5 bis 6 h (Schätzung)"},{"von":"Flughafen Bangkok","nach":"Flusshotel","art":"Auto","dauer":"ca. 45 bis 90 Min. je nach Verkehr (Schätzung)"},{"von":"Bangkok","nach":"Frankfurt","art":"Flug","dauer":"ca. 11,5 bis 12 h nonstop über Nacht (Schätzung)"}],"tage":[{"tag":1,"ort":"Frankfurt","titel":"Abflug ins Warme","energie":"ruhig","text":"Mittags hebt ihr ab, nonstop mit Thai Airways, ohne Umweg über ein europäisches Drehkreuz. Erst Mittagessen über den Alpen, dann ein Film, später wird es draußen dunkel und ihr schlaft in den Morgen über dem Golf von Bengalen. Kein Stress, kein Anschluss in Europa.","highlights":["Nonstop nach Bangkok","Erster Sekt als Ehepaar über den Wolken"],"tipp":"Zweierplätze am Fenster früh reservieren; TDAC frühestens 3 Tage vor Ankunft online ausfüllen (recherchiert, AA).","bild":{"url":"https://images.unsplash.com/photo-1603277103691-756354934c2d?w=1600&q=80","credit":"Shaun Alam, Unsplash License","quelle":"https://unsplash.com/photos/white-and-blue-airplane-wing-UyvVGKtNuig"}},{"tag":2,"ort":"Koh Samui","titel":"Landung im Grünen","energie":"ruhig","text":"Frühmorgens in Bangkok landen, einreisen, dann ein kurzer Hüpfer nach Samui. Eine Stunde Fahrt an die stille Westküste, Villa beziehen, Mittagsschlaf. Am Abend sitzt ihr auf dem Balkon und seht die Sonne zum ersten Mal hinter den Inseln versinken.","highlights":["Erster Sprung in den eigenen Pool","Sonnenuntergang vom Balkon"],"tipp":"Bis ca. 21 Uhr wach bleiben, dann ist der Jetlag am nächsten Tag kaum zu spüren (Schätzung).","bild":{"url":"https://images.unsplash.com/photo-1572529593091-6c05c37cacc7?w=1600&q=80","credit":"Yavor Punchev, Unsplash License","quelle":"https://unsplash.com/photos/EerfoqyC7aM"}},{"tag":3,"ort":"Koh Samui","titel":"Frühstück im eigenen Pool","energie":"ruhig","text":"Der erste Muss-Moment: Ein schwimmendes Tablett mit Mango, Kaffee und Eiern im eigenen Pool, unter euch das Grün, dahinter das Meer. Danach Strand, Liege, Buch. Am Nachmittag eine Paarmassage im Spa.","highlights":["Schwimmendes Frühstück mit Grünblick","Paarmassage","Faulenzen ohne Plan"],"tipp":"Floating Breakfast am Vorabend bestellen, meist gegen Aufpreis (Annahme, je Resort prüfen).","bild":{"url":"https://images.unsplash.com/photo-1756115374220-c43b04be3a53?w=1600&q=80","credit":"Ann Kolisnyk, Unsplash License","quelle":"https://unsplash.com/photos/floating-breakfast-tray-with-food-and-drinks-in-pool-797NfqTtx08"}},{"tag":4,"ort":"Ang-Thong-Meeresnationalpark","titel":"42 Inseln im Türkis","energie":"aktiv","text":"Speedboot zu den Kalkinseln von Ang Thong: Ihr paddelt mit dem Kajak an steilen Felsen entlang, steigt zum Aussichtspunkt über dem Archipel und schaut in den Smaragdsee im Inneren einer Insel. Am Nachmittag seid ihr zurück am Pool.","highlights":["Kajak zwischen Kalkfelsen","Aussichtspunkt über dem Archipel","Smaragdsee"],"tipp":"Früher Start Nr. 1 von höchstens 2. Kleingruppe statt großes Ausflugsboot; privat kostet laut Portal ca. 920 € (recherchiert, unklar ob pro Person oder pro Boot). Der Aufstieg zum Aussichtspunkt ist steil, ca. 30 bis 45 Min. (Schätzung). Bei Wellen auf Tag 6 tauschen.","bild":{"url":"https://images.unsplash.com/photo-1752628489583-17d472153d6d?w=1600&q=80","credit":"Simon Cheung, Unsplash License","quelle":"https://unsplash.com/photos/islands-dot-the-bright-sunny-turquoise-sea-aLbd5o62VGk"}},{"tag":5,"ort":"Koh Samui","titel":"Grüner Faulenztag","energie":"ruhig","text":"Nach dem Bootstag passiert nichts, mit Absicht. Spät frühstücken, im Pool treiben, mittags Kokosnuss am Strand. Wer mag, lässt sich am Nachmittag zu einem Aussichtspunkt in den grünen Hügeln fahren.","highlights":["Ausschlafen","Spa oder Strand, ihr entscheidet"],"tipp":"Reserveabend für das Sonnenuntergangs-Dinner, falls Tag 7 bewölkt ist.","bild":{"url":"https://images.unsplash.com/photo-1775478944607-12eb760fc067?w=1600&q=80","credit":"Seongjin Park, Unsplash License","quelle":"https://unsplash.com/photos/ENf8893bW-A"}},{"tag":6,"ort":"Koh Samui","titel":"Goldener Buddha und Nachtmarkt","energie":"mittel","text":"Mit eigenem Fahrer am späten Vormittag zum Big Buddha und zum bunten Tempel Wat Plai Laem, danach zum Na-Muang-Wasserfall. Am Abend schlendert ihr über die Walking Street im Fisherman's Village: Lampions, Kokoseis, Seide und kleine Geschenke.","highlights":["Big Buddha","Wat Plai Laem","Nachtmarkt Fisherman's Village"],"tipp":"Schultern und Knie in Tempeln bedecken. Der Markt ist freitags am größten (Schätzung). Im Juni führt der Wasserfall eher wenig Wasser (Schätzung).","bild":{"url":"https://images.unsplash.com/photo-1556463207-5f043fc03306?w=1600&q=80","credit":"Kit Suman, Unsplash License","quelle":"https://unsplash.com/photos/G4fZjI14WpU"}},{"tag":7,"ort":"Koh Samui","titel":"Dinner am leeren Strand","energie":"ruhig","text":"Der zweite Muss-Moment: Ein Tisch nur für euch im Sand von Taling Ngam, Fackeln, Blick nach Westen, wo die Sonne golden zwischen den Inseln verschwindet. Vorher ein letzter fauler Tag am Pool.","highlights":["Privates Sonnenuntergangs-Dinner","Goldenes Licht über dem Golf"],"tipp":"Strand-Dinner früh beim Resort anfragen, mildes Menü und Getränke vorab absprechen. Angebot und Preis offen, ca. 150 bis 300 € für zwei (Schätzung).","bild":{"url":"https://images.unsplash.com/photo-1579211975029-8aa27c32fa75?w=1600&q=80","credit":"Philipp Potocnik, Unsplash License","quelle":"https://unsplash.com/photos/green-palm-trees-on-seashore-during-golden-hour-tHFwghQrMuM"}},{"tag":8,"ort":"Koh Phangan","titel":"Übersetzen in die Dschungelbucht","energie":"ruhig","text":"Gemütlich auschecken, dann bringt euch ein Speedboot über das glatte Wasser nach Koh Phangan. Thong Nai Pan Noi ist eine kleine Bucht zwischen bewaldeten Hügeln, ohne Partys und ohne Hektik. Villa beziehen, barfuß an den Strand, früh essen.","highlights":["Bootsfahrt zwischen zwei Inseln","Erster Abend in der stillen Bucht"],"tipp":"Privates Boot zum Santhiya-Pier ca. 10.000 THB pro Boot, ca. 265 €; Sammel-Speedboot 800 bis 1.100 THB p. P., im Juni Abfahrten um 12 und 16 Uhr (recherchiert, Santhiya, Stand 2026).","bild":{"url":"https://images.unsplash.com/photo-1606472679046-7a270deced3d?w=1600&q=80","credit":"Elizabeth Gottwald, Unsplash License","quelle":"https://unsplash.com/photos/aerial-view-of-green-trees-near-body-of-water-during-daytime-oacWGBoBQ98"}},{"tag":9,"ort":"Koh Phangan","titel":"Pool, Palmen, Dschungelblick","energie":"ruhig","text":"Frühstück am eigenen Pool, rundherum Bananenstauden und Palmen. Die Bucht liegt nach Osten, die Sonne geht also über dem Meer auf, ganz ohne Wecker, falls ihr wach seid. Der Rest des Tages gehört Strand und Pool.","highlights":["Pool-Frühstück mit Dschungelblick","Schwimmen in der stillen Bucht"],"tipp":"Abends lange, leichte Kleidung und Mückenschutz, am Dschungelhang gibt es mehr Mücken (Schätzung).","bild":{"url":"https://images.unsplash.com/photo-1626571115951-15371ba9354b?w=1600&q=80","credit":"Ardi Evans, Unsplash License","quelle":"https://unsplash.com/photos/green-banana-tree-near-swimming-pool-during-daytime-urVEEnmlEkE"}},{"tag":10,"ort":"Koh Phangan","titel":"Mit dem Longtail zu den Nachbarbuchten","energie":"mittel","text":"Ab dem späten Vormittag tuckert ihr mit einem Longtail-Boot die wilde Ostküste entlang zur Bucht Than Sadet mit ihrem kleinen Wasserfall, später zum Bottle Beach, an den keine Straße führt. Unterwegs gibt es ein Picknick im Schatten und Fotos an menschenleeren Stränden.","highlights":["Than Sadet","Bottle Beach","Picknick am Strand"],"tipp":"Das Boot nur für euch zwei am Strand mieten und den Preis vorher festmachen (Annahme). Im Juni führt der Wasserfall eher wenig Wasser (Schätzung).","bild":{"url":"https://images.unsplash.com/photo-1704907867940-8dbf5b630328?w=1600&q=80","credit":"Tom Lorber, Unsplash License","quelle":"https://unsplash.com/photos/a-sandy-beach-next-to-a-lush-green-forest-covered-mountain-ctN255ufkts"}},{"tag":11,"ort":"Koh Tao und Koh Nang Yuan","titel":"Schnorcheln mit Schildkröten","energie":"aktiv","text":"Mit dem Boot nach Koh Tao: In der Shark Bay schnorcheln die meisten Touren mit grünen Meeresschildkröten und kleinen Schwarzspitzen-Riffhaien, danach die Sandbank von Koh Nang Yuan, die drei Inseln verbindet. Am späten Nachmittag seid ihr zurück in der Bucht.","highlights":["Schildkröten in der Shark Bay","Sandbank von Koh Nang Yuan","Aow Leuk"],"tipp":"Früher Start Nr. 2. Touren ab Phangan ab ca. 1.790 THB p. P., ca. 7 h (recherchiert); Abholung in Thong Nai Pan vorher klären. Schildkröten sind Glückssache. Mit privatem Boot seid ihr vor den Gruppen dort.","bild":{"url":"https://images.unsplash.com/photo-1437622368342-7a3d73a34c8f?w=1600&q=80","credit":"Wexor Tmg, Unsplash License","quelle":"https://unsplash.com/photos/L-2p8fapOA8"}},{"tag":12,"ort":"Koh Phangan","titel":"Letzter Inseltag zu zweit","energie":"ruhig","text":"Ein Tag nur für euch: Hängematte unter der schiefen Palme, Paarmassage, letzte Runde im Meer. Am Abend ein privates Dinner auf der Villa-Terrasse oder am Strand, mit Kerzen und Meeresrauschen.","highlights":["Paar-Spa","Abschieds-Dinner in der Bucht"],"tipp":"Am Ostufer gibt es keinen Sonnenuntergang über dem Meer. Dafür ist der Sternenhimmel gut (Schätzung).","bild":{"url":"https://images.unsplash.com/photo-1644027620178-83cf81e8ece4?w=1600&q=80","credit":"Johnny Africa, Unsplash License","quelle":"https://unsplash.com/photos/a-tropical-beach-with-a-palm-tree-leaning-over-the-water-IzkxzMQXIow"}},{"tag":13,"ort":"Bangkok","titel":"Wat Arun im Abendlicht","energie":"mittel","text":"Am Vormittag mit dem Boot nach Samui und mit dem Flugzeug nach Bangkok. Am späten Nachmittag sitzt ihr am Flussufer gegenüber, wenn Wat Arun im Abendlicht über dem Chao Phraya leuchtet. Danach ein Glas auf dem Rooftop des Hotels.","highlights":["Wat Arun zum Sonnenuntergang","Rooftop-Pool über dem Fluss"],"tipp":"Ein Transfertag ist ein halber Tag, deshalb abends nur Wat Arun. Mit Taxameter oder App-Diensten fahren (recherchiert, AA).","bild":{"url":"https://images.unsplash.com/photo-1613672803979-a6edfc5a179b?w=1600&q=80","credit":"Anantachai Saothong, Unsplash License","quelle":"https://unsplash.com/photos/wat-arun-temple-in-bangkok-0DKDTSFBXc8"}},{"tag":14,"ort":"Bangkok","titel":"Goldene Tempel und Blumenmarkt","energie":"aktiv","text":"Wat Pho mit dem liegenden Buddha und den goldenen Spitzen, dann mit dem Flussboot zum Blumenmarkt Pak Khlong Talat voller Ringelblumen und Orchideen. Mittags Pause am Pool. Am Abend ein Dinner hoch über der leuchtenden Stadt.","highlights":["Wat Pho","Blumenmarkt Pak Khlong Talat","Rooftop-Dinner"],"tipp":"Wat Pho ist früh oder ab ca. 16 Uhr ruhiger (Schätzung). Den Grand Palace mit seinem Andrang auslassen.","bild":{"url":"https://images.unsplash.com/photo-1768393483296-249efa2f7ad5?w=1600&q=80","credit":"Sergei Gussev, Unsplash License","quelle":"https://unsplash.com/photos/ornate-golden-temple-spires-against-a-blue-sky-4FPXzWEjZVw"}},{"tag":15,"ort":"Bangkok","titel":"Kochkurs und Nachtflug","energie":"mittel","text":"Vormittags ein Kochkurs mit Marktbesuch: Kräuter riechen, Curry selbst stampfen, Chili nur so viel, wie Liz mag. Danach Late-Checkout, eine letzte Massage und ein frühes Abendessen, bevor es zum Flughafen geht.","highlights":["Kochkurs mit Marktbesuch","Letzte Thai-Massage","Nachtflug nach Hause"],"tipp":"Kurse mit Marktbesuch kosten ca. 40 bis 49 USD p. P. (recherchiert, Portale 2026). Late-Checkout bis zum Abend anfragen oder eine dritte Nacht als Tageszimmer buchen, ca. 60 bis 120 € (Schätzung).","bild":{"url":"https://images.unsplash.com/photo-1722995690313-9ef561d30143?w=1600&q=80","credit":"Duong Ngan, Unsplash License","quelle":"https://unsplash.com/photos/a-wooden-table-topped-with-plates-of-food-l_T_qXBauO8"}},{"tag":16,"ort":"Frankfurt","titel":"Ankunft mit Sonne im Gepäck","energie":"ruhig","text":"Ihr schlaft über Asien und Europa und landet früh am Morgen in Frankfurt. Heimfahrt, Koffer in die Ecke, und am Abend das erste Foto als Hintergrundbild.","highlights":["Nonstop nach Hause","Ein freier Tag zum Ankommen"],"tipp":"Den Tag danach frei halten, nach Westen ist der Jetlag milder (Schätzung).","bild":{"url":"https://images.unsplash.com/photo-1605217613274-f9ecc3b03753?w=1600&q=80","credit":"Anna Sullivan, Unsplash License","quelle":"https://unsplash.com/photos/airplane-window-view-of-clouds-during-daytime-nNU2nAFN34c"}}],"warum_ihr":["Frühstück am eigenen Pool mit Grünblick, gleich zweimal: auf Samui über grünem Hang zum Meer, auf Phangan mitten im Dschungel der Bucht.","Einsamer Strand mit Dinner bei Sonnenuntergang: Taling Ngam ist die ruhige Westküste Samuis und schaut genau nach Westen.","Schildkröten, Tempel, Markt, Kochkurs: Shark Bay auf Koh Tao, Big Buddha, Wat Arun, Wat Pho, Nachtmarkt, Blumenmarkt und ein milder Kochkurs.","Wenig Stress: ein Umstieg, ein ruhiges erstes Ziel, nur zwei frühe Starts, nach jedem Ausflugstag ein fauler Tag.","Für Liz: Spa-Kultur, Fotobuchten, Zweisamkeit in ruhigen Buchten, kürzeste Langstrecke der Asien-Optionen (Schätzung).","Ehrlich: Es gibt keinen Vulkan und keine Reisterrassen, und die Wasserfälle führen im Juni eher wenig Wasser. Das ist Strandurlaub de luxe mit Kultur zum Schluss."],"liz_check":{"langstrecke":"Längste Etappe ca. 10,5 bis 11 h nonstop, Abflug mittags, danach nur ein kurzer Hüpfer (recherchiert). Auf dem Rückweg erst zwei Tage Bangkok, dann der Nachtflug. Zweierplätze reservieren; Fragen zur Flugangst gehen an die Gesundheit.","insekten":"Ehrlich: Am Dschungelhang gibt es Mücken, Geckos und Ameisen. Dengue, Zika und Chikungunya kommen ganzjährig landesweit vor; Malaria ist auf Samui und Phangan gering, Bangkok ist malariafrei (recherchiert, AA). Gegenmittel: geschlossenes, klimatisiertes Schlafzimmer, Repellent, abends lange Kleidung.","essen":"Viele Gerichte sind mild. 'Mai phet' heißt 'nicht scharf'; Resorts kochen auf Wunsch mild, und im Kochkurs bestimmt Liz den Chili selbst (Schätzung).","trubel":"Ruhige Ecken gewählt: Taling Ngam statt Chaweng, Thong Nai Pan Noi statt Haad Rin. Juni ist Nebensaison. Ang Thong, Nang Yuan und Wat Pho früh oder in kleiner Gruppe besuchen. Die Vollmondnächte um den 06.06. und 05.07.2028 auf Phangan möglichst meiden (Schätzung)."},"wetter":{"juni":"Am Golf die bessere Thailand-Seite: Samui max. ca. 29,5 °C, Meer ca. 30 °C, ca. 92 mm Regen, ca. 11 Sonnenstunden (recherchiert, Klimatabelle). Eine andere Quelle zählt an ca. 54 % der Tage etwas Regen (recherchiert, bestdateweather). Einschätzung: kurze Schauer, selten Dauerregen (Schätzung). Bangkok ist in der Regenzeit, heiß, mit Gewittern am Nachmittag (Schätzung).","juli":"Ähnlich, ca. 88 mm, Meer ca. 30 °C (recherchiert). Ab 10.07. NRW-Ferien und europäische sowie asiatische Sommerferien: Flüge und Villen teurer, Ausflugsboote voller (Schätzung).","august":"Ca. 97 mm, Meer ca. 29 °C (recherchiert). Sommerspitze bei Preisen und Andrang (Schätzung). Die eigentliche Regenzeit am Golf ist Oktober bis Dezember."},"einreise_gesundheit":["Deutscher Reisepass für beide (Annahme), bei Einreise noch mindestens 6 Monate gültig; der Personalausweis reicht nicht (recherchiert, AA Stand 11/2026).","Visumfrei bis 30 Tage seit 15.09.2026, die 16-Tage-Reise passt (recherchiert, AA). Die Regel kann sich bis 2028 ändern, deshalb vor der Buchung neu prüfen.","Digitale Einreisekarte TDAC kostenlos, frühestens 3 Tage vor Ankunft online, nur über die offizielle Seite (recherchiert, AA).","Stichproben bei Einreise: 20.000 THB p. P. in bar (ca. 550 €) und ein Nachweis für den Rückflug (recherchiert, AA).","Eingereist wird in Bangkok, Samui ist ein Inlandsflug. Durchgechecktes Gepäck mit Bangkok Airways ist bei Partnerflügen möglich, für eure Strecke aber offen.","Bei Einreise aus Deutschland keine Pflichtimpfungen. Empfohlen ist Hepatitis A, weitere je nach Risiko (recherchiert, AA). Mückenschutz tags und nachts. Impfungen und Zika bei Kinderwunsch mit Ärztin oder Tropeninstitut klären. Auslandskrankenversicherung mit Rücktransport."],"budget_posten":[{"posten":"Flüge (Frankfurt–Bangkok hin und zurück, 2 x Bangkok–Samui)","von":1600,"bis":2800},{"posten":"Unterkunft (13 Nächte plus Late-Checkout)","von":2500,"bis":4500},{"posten":"Essen und Getränke","von":750,"bis":1400},{"posten":"Transfers vor Ort (Speedboote, Fahrer, Taxis)","von":300,"bis":700},{"posten":"Aktivitäten (Ang Thong, Koh Tao, Longtail, Strand-Dinner, Kochkurs)","von":500,"bis":1300},{"posten":"Spa und Massagen","von":200,"bis":450},{"posten":"Gebühren (Nationalpark, Nang Yuan, Tempel)","von":30,"bis":60},{"posten":"Versicherung","von":200,"bis":350},{"posten":"Puffer ca. 10 % (Preise inkl. ca. 6 % Steigerung bis 2028; 1 € ≈ 38 THB, X-Rates 03.11.2026; USD-Kurs Annahme 0,87 €)","von":610,"bis":1160}],"risiken":[{"risiko":"Wellen oder Schauer an einem Bootstag (Ang Thong, Koh Tao)","gegenmassnahme":"Bootstage flexibel buchen und mit einem faulen Tag tauschen (Tag 4 mit 6, Tag 11 mit 10 oder 12); Wetter am Vorabend prüfen. Ob Ang Thong im Juni offen ist: offen, prüfen."},{"risiko":"Anschluss Bangkok–Samui verpasst oder Gepäck bleibt hängen","gegenmassnahme":"Ein Ticket mit Thai und Bangkok Airways als Partner, durchgechecktes Gepäck vorher bestätigen lassen, mindestens 2,5 bis 3 h Umsteigezeit."},{"risiko":"Mücken und Dengue im Dschungel, Liz fühlt sich unwohl","gegenmassnahme":"Villa mit geschlossenem, klimatisiertem Schlafzimmer wählen, Repellent, abends lange Kleidung; Impfberatung über die Gesundheit."},{"risiko":"Budget rutscht über 8.500 €","gegenmassnahme":"Zwei Sparhebel: Avani+ statt InterContinental auf Samui (ca. 700 bis 1.000 € weniger, Schätzung) und das Sammel-Speedboot statt eines privaten Boots (ca. 300 € weniger)."},{"risiko":"Präparierte Getränke und Betrug (AA warnt für Samui, Phangan, Tao)","gegenmassnahme":"Getränke nie unbeaufsichtigt lassen, Partystrände und Vollmondnächte meiden, Fahrten über Resort, Taxameter oder App mit Festpreis."}],"plan_b":"Fallen Ang Thong oder Koh Tao wegen Wellen aus, rückt der Ausflug auf einen Ersatztag; klappt es gar nicht, gibt es einen Kochkurs auf Samui, ein Spa und das Longtail entlang der geschützten Küste. Bei Wolken findet das Strand-Dinner am Reserveabend (Tag 5 oder 6) statt. Bei Regen in Bangkok: Massage, Rooftop mit Dach, Kanalboot und das Einkaufszentrum ICONSIAM am Fluss.","quellen":[{"titel":"Auswärtiges Amt: Thailand, Reise- und Sicherheitshinweise","url":"https://www.auswaertiges-amt.de/de/service/laender/thailand-node/thailandsicherheit-201558","stand":"2026-11-07"},{"titel":"Thai Airways: Flüge Frankfurt–Bangkok","url":"https://www.thaiairways.com/flights/de-de/flüge-ab-frankfurt-nach-bangkok","stand":"2026-11-07"},{"titel":"Swoodoo: Flüge Frankfurt–Thailand","url":"https://www.swoodoo.com/de/flug/Frankfurt-am-Main-FK0/Thailand-TH0","stand":"2026-11-07"},{"titel":"Kayak: Bangkok–Koh Samui","url":"https://www.kayak.com/flight-routes/Bangkok-Suvarnabhumi-other-airports-BKK/Ko-Samui-USM","stand":"2026-11-07"},{"titel":"Santhiya Koh Phangan: Transfers ab Samui","url":"https://kohphangan.santhiya.com/transfer","stand":"2026-11-07"},{"titel":"Mr & Mrs Smith: Anantara Rasananda, Zimmer","url":"https://www.mrandmrssmith.com/luxury-hotels/anantara-rasananda/rooms","stand":"2026-11-07"},{"titel":"Expedia: Anantara Rasananda","url":"https://mob.expedia.ae/Ko-Pha-Ngan-Hotels-Anantara-Rasananda-Koh-Phangan-Villas.h2314609.Hotel-Information","stand":"2026-11-07"},{"titel":"Hotels.com: Santhiya Koh Phangan","url":"https://uk.hotels.com/ho253717/santhiya-koh-phangan-resort-spa-ko-pha-ngan-thailand/","stand":"2026-11-07"},{"titel":"InterContinental Koh Samui: Zimmer und Villen","url":"https://samui.intercontinental.com/rooms-suites","stand":"2026-11-07"},{"titel":"Expedia: Privattour Ang Thong ab Samui","url":"https://www.expedia.com/es/things-to-do/desde-koh-samui-recorrido-privado-por-el-parque-marino-de-ang-thong.a48363559.detalles-actividades","stand":"2026-11-07"},{"titel":"Klimatabelle Koh Samui","url":"https://www.klimatabelle.info/asien/thailand/koh-samui","stand":"2026-11-07"},{"titel":"Snorkeling Report: Aow Leuk, Koh Tao","url":"https://www.snorkeling-report.com/spot/snorkeling-aow-leuk-koh-tao/","stand":"2026-11-07"},{"titel":"Sand in my Suitcase: Schnorcheln auf Koh Tao","url":"https://sandinmysuitcase.com/snorkeling-koh-tao-thailand/","stand":"2026-11-07"},{"titel":"X-Rates: Wechselkurs EUR/THB","url":"https://www.x-rates.com","stand":"2026-11-07"}]},{"id":"C","titel":"Mauritius: ein Flug, Bergwald und Lagune","untertitel":"Ein einziger Nachtflug, dann Frühstück am eigenen Pool über dem Bergwald und neun Tage Lagune, Wale und Sonnenuntergänge an der Westküste.","farbe":"#1FB5C9","hero":{"url":"https://images.unsplash.com/photo-1513415563383-4e580ed27a46?w=1600&q=80","credit":"Xavier Coiffic, Unsplash License","quelle":"https://unsplash.com/photos/aerial-photography-of-sea-near-mountain-at-daytime-WV4B_aVj0aQ"},"eckdaten":{"monat":"Juni 2028 (Vorschlag: Sa 24.06. bis So 09.07.2028, Annahme: Condor-Flugtage wie 2026/27, hängt vom Hochzeitsdatum ab)","naechte":14,"budget_von":7300,"budget_bis":10900,"budget_mitte":9100,"ampel":"eng","anreise":"Condor nonstop Frankfurt–Mauritius, ca. 11,5 h, Airbus A330-900neo. Hin: ab ca. 16:00–16:35, an ca. 06:05 am Folgetag. Zurück: ab 08:40, an Frankfurt ca. 17:45 (recherchiert, Flugplan 2026; Flugplan 2028 offen). Rail&Fly ab NRW möglich (recherchiert).","zeitverschiebung":"+2 h (gegenüber deutscher Sommerzeit)","stopover":""},"stationen":[{"name":"Chamarel (Bergwald im Südwesten)","land":"Mauritius","naechte":5,"lat":-20.427,"lon":57.385,"unterkunft":"Lodge-Suite mit Privatpool und Blick in Berge und Garten","beispiele":[{"name":"Lakaz Chamarel Exclusive Lodge, Mountain & Garden Pool Suite","warum":"ca. 90 m², eigener Pool, Außendusche, wird für Hochzeitsreisende vermarktet; mitten im Grünen, Wasserfall und Siebenfarbige Erde in Minuten erreichbar (recherchiert, offizielle Seite)","preis":"ca. 280–380 €/Nacht inkl. Frühstück (Schätzung; Portale zeigen 204–536 USD/Nacht ohne Zimmertyp, recherchiert; Verpflegung auf der Website nicht angegeben)","url":"https://www.lakazchamarel.com/"},{"name":"Lakaz Chamarel, Private Villa","warum":"ca. 135–140 m², Privatpool mit Blick über Berge und Garten; das Upgrade, falls ihr in Chamarel nicht sparen wollt (recherchiert)","preis":"ca. 400–550 €/Nacht (Schätzung)","url":"https://www.lakazchamarel.com/"},{"name":"Villa Le Flamboyant, Le Morne (Airbnb)","warum":"Privatpool am Fuß des Le Morne mit Meerblick, Bewertung 4,92 (recherchiert); Ausweichoption, falls Lakaz ausgebucht ist, aber eher Strand als Bergwald","preis":"nicht veröffentlicht (offen)","url":""}]},{"name":"La Preneuse / Tamarin (Westküste)","land":"Mauritius","naechte":9,"lat":-20.355,"lon":57.363,"unterkunft":"Kleine Ferienvilla mit Privatpool in Strandnähe, Frühstück selbst","beispiele":[{"name":"Searenity Villas, La Preneuse","warum":"Neu gebaute, balinesisch inspirierte Villen; die beiden 150-m²-Villen haben eigenen Pool, Terrasse, Außendusche; ca. 100 m zum Strand La Preneuse (recherchiert, Angaben der Portale weichen ab; Privatpool vor Buchung schriftlich bestätigen lassen)","preis":"ca. 180–260 €/Nacht (Schätzung, Preise nicht veröffentlicht)","url":"https://www.snaptrip.com/properties/mauritius/black-river-district/grande-riviere-noire/searenity-villas"},{"name":"Rooftop Garden Villa, Tamarin/Black River","warum":"1 Schlafzimmer, Privatpool, Strandzugang, ca. 7 Gehminuten zum Strand La Preneuse (recherchiert, Travelocity); genau die richtige Größe für zwei","preis":"ca. 120–200 €/Nacht (Schätzung)","url":""},{"name":"Maradiva Villas Resort & Spa, Flic en Flac","warum":"Jede Villa mit beheiztem Privatpool, Spa im Haus (recherchiert); nur als 2–3-Nächte-Upgrade denkbar, sprengt sonst das Budget","preis":"Preise auf Anfrage, eher ab 600 €/Nacht (Schätzung)","url":""}]}],"wege":[{"von":"Zuhause (NRW)","nach":"Frankfurt Flughafen","art":"Zug","dauer":"ca. 2–3 h mit Rail&Fly (Schätzung)"},{"von":"Frankfurt","nach":"Mauritius (MRU)","art":"Flug","dauer":"ca. 11,5 h nonstop, über Nacht (recherchiert)"},{"von":"Flughafen MRU","nach":"Chamarel","art":"Auto","dauer":"ca. 1–1,5 h mit Fahrer (Schätzung, Bergstraße)"},{"von":"Chamarel","nach":"La Preneuse / Tamarin","art":"Auto","dauer":"ca. 30–45 min (Schätzung)"},{"von":"La Preneuse","nach":"Port Louis (Ausflug)","art":"Auto","dauer":"ca. 45–60 min (Schätzung)"},{"von":"La Preneuse","nach":"Trou aux Biches (Ausflug)","art":"Auto","dauer":"ca. 1–1,25 h (Schätzung, Faustregel Verkehr)"},{"von":"La Preneuse","nach":"Flughafen MRU","art":"Auto","dauer":"ca. 1–1,25 h (Schätzung)"},{"von":"Mauritius (MRU)","nach":"Frankfurt","art":"Flug","dauer":"ca. 11 h, Tagflug (recherchiert)"}],"tage":[{"tag":1,"ort":"Frankfurt","titel":"Ein Flug, fertig","energie":"mittel","text":"Mittags mit Rail&Fly nach Frankfurt, am Nachmittag hebt der Condor-A330neo nonstop ab (ca. 16:00–16:35, recherchiert für 2026). Abendessen an Bord, dann Licht aus: Ihr schlaft über Afrika hinweg, kein Umstieg, kein Gate-Wechsel, kein Gepäckbangen.","highlights":["Nonstop, nur ein Flug","Nachtflug zum Durchschlafen"],"tipp":"Sitzplätze nebeneinander vorab reservieren. Tickets auf den Namen buchen, der im Reisepass steht, den ihr tatsächlich mitnehmt (Namenswechsel nach der Hochzeit beachten).","bild":{"url":"https://images.unsplash.com/photo-1483683804023-6ccdb62f86ef?w=1600&q=80","credit":"Denys Nevozhai, Unsplash License (Symbolbild)","quelle":"https://unsplash.com/photos/birds-eye-view-of-islands-guNIjIuUcgY"}},{"tag":2,"ort":"Chamarel","titel":"Ankunft im Bergwald","energie":"ruhig","text":"Landung gegen 06:05, ein Fahrer bringt euch durch Zuckerrohrfelder hinauf nach Chamarel. Ankommen, duschen, in den eigenen Pool, Mittagsschlaf. Zum Sonnenuntergang um ca. 17:40 auf einen Drink an die Aussichtsbar der Lodge.","highlights":["Erster Sprung in den Privatpool","Sonnenuntergang an der View Bar (16:30–19:30 geöffnet, recherchiert)"],"tipp":"Früher Check-in ist nicht garantiert: anfragen oder die Suite ab der Vornacht buchen. Nach dem Nachtflug nicht selbst im Linksverkehr fahren, Mietwagen erst ab Tag 4 an die Lodge bringen lassen (Annahme: Vermieter liefern).","bild":{"url":"https://images.unsplash.com/photo-1721989519334-40923a0ee1c0?w=1600&q=80","credit":"Sanju Pandita, Unsplash License (Symbolbild)","quelle":"https://unsplash.com/photos/ksa5r_xt8cg"}},{"tag":3,"ort":"Chamarel","titel":"Frühstück am eigenen Pool","energie":"ruhig","text":"Euer erster Muss-Moment: Frühstück auf der Terrasse, der Pool vor euch, dahinter nur Grün und Berge. Ausschlafen ausdrücklich erlaubt. Nachmittags Wellness in der Lodge, abends kreolisches Dinner im Lodge-Restaurant.","highlights":["Pool-Frühstück mit Grünblick","Spa-Nachmittag"],"tipp":"Im Juni ist es morgens auf der Höhe nur ca. 17–20 °C (Schätzung): eher um 9 Uhr frühstücken, eine Strickjacke einpacken und vorab fragen, ob der Pool beheizt ist (offen).","bild":{"url":"https://images.unsplash.com/photo-1532323544230-7191fd51bc1b?w=1600&q=80","credit":"Hutomo Abrianto, Unsplash License (Symbolbild)","quelle":"https://unsplash.com/photos/9mPl0Zo7_gQ"}},{"tag":4,"ort":"Chamarel","titel":"Wasserfall und Siebenfarbige Erde","energie":"mittel","text":"Um 8:30 öffnet der Geopark (Juni bis September 8:30–17:00, recherchiert): Ihr seid vor den Busgruppen an den farbigen Dünen und am Chamarel-Wasserfall, der aus dem Grün in die Schlucht fällt. Mittags Verkostung und Essen in der Rum-Destillerie von Chamarel, nachmittags zurück an den Pool.","highlights":["Chamarel-Wasserfall","Siebenfarbige Erde ohne Gedränge"],"tipp":"Eintritt laut Quellen uneinheitlich, ca. 15–25 € p. P. (Schätzung). Die Lodge liegt in der Nähe, 8:30 ist also kein harter Frühstart.","bild":{"url":"https://images.unsplash.com/photo-1756715401699-aa2b86a6175c?w=1600&q=80","credit":"Frank Eiffert, Unsplash License","quelle":"https://unsplash.com/photos/s6xIM4F4C7E"}},{"tag":5,"ort":"Chamarel","titel":"Faul, dann der heilige See","energie":"ruhig","text":"Vormittag ohne Programm: Pool, Buch, Massage. Am späten Nachmittag eine kurze Fahrt (ca. 30–40 min, Schätzung) über den Aussichtspunkt der Black River Gorges zum Grand Bassin, dem Hindu-Heiligtum am Kratersee mit der großen Shiva-Statue.","highlights":["Ausblick über die Black River Gorges","Tempel am Grand Bassin"],"tipp":"Am Tempel Schultern und Knie bedecken, Schuhe aus. Die Affen am See nicht füttern.","bild":{"url":"https://images.unsplash.com/photo-1690576621576-26443f0f48c7?w=1600&q=80","credit":"Dan DY, Unsplash License","quelle":"https://unsplash.com/photos/1OLqSEXXlGA"}},{"tag":6,"ort":"Le Morne","titel":"Le Morne: Berg oder Strand","energie":"aktiv","text":"Der UNESCO-Berg Le Morne Brabant ragt über die türkisfarbenste Lagune der Insel. Wer will, wandert mit lokalem Guide hinauf (Start ab 7 Uhr am Tor, ca. 3–4 h, Schätzung), oben liegt die ganze Lagune unter euch. Danach oder stattdessen: Strand von Le Morne, Schwimmen, Picknick im Schatten der Filaos-Bäume.","highlights":["Blick vom Le Morne über die Lagune","Strand von Le Morne"],"tipp":"Öffnungszeiten (7:00–14:30 oder 7:00–16:00) und Guide-Pflicht für den Gipfelteil sind laut Quellen widersprüchlich (recherchiert). Das ist euer optionaler Frühstart Nummer 1, ihr könnt ihn auch auslassen.","bild":{"url":"https://images.unsplash.com/photo-1739093199916-062927852ef8?w=1600&q=80","credit":"Sourabh Adhya, Unsplash License","quelle":"https://unsplash.com/photos/a-view-of-the-ocean-from-the-top-of-a-mountain-qRMvVEYWkL8"}},{"tag":7,"ort":"La Preneuse / Tamarin","titel":"Umzug an die Lagune","energie":"ruhig","text":"Nur 30 bis 45 Minuten bergab, und ihr seid am Meer. Unterwegs im Supermarkt Obst, Baguette und Kaffee für die Frühstücke in der Villa kaufen. Pool, Strand La Preneuse, erster Sonnenuntergang über dem Meer.","highlights":["Eigene Villa mit Pool","Sonnenuntergang am Strand La Preneuse"],"tipp":"Check-out und Check-in so legen, dass ihr mittags fahrt: Dann bleibt der Morgen in Chamarel für ein letztes Pool-Frühstück.","bild":{"url":"https://images.unsplash.com/photo-1690413994339-2b147e5129c8?w=1600&q=80","credit":"Liga Meijere, Unsplash License","quelle":"https://unsplash.com/photos/a-beach-with-clear-blue-water-and-a-white-house-in-the-distance-BVsTfmaj6YE"}},{"tag":8,"ort":"Lagune Westküste","titel":"Kristallfelsen und Sandbank","energie":"aktiv","text":"Mit einem kleinen Privatboot statt des großen Partykatamarans hinaus in die Lagune: zum Crystal Rock, zur Sandbank und zur Île aux Bénitiers, dazwischen Schnorcheln im Klaren. Mittags zurück, nachmittags Siesta am Pool.","highlights":["Crystal Rock in der Lagune","Schnorcheln, Sandbank, Kokosnuss"],"tipp":"Früh starten (ca. 8:30–9:00, Annahme), dann seid ihr vor den Ausflugsbooten da. Touren mit Delfin-Schwimmen auslassen, sie belästigen die Tiere. Privatboot ca. 150–250 € für zwei (Schätzung).","bild":{"url":"https://images.unsplash.com/photo-1581702576086-0fb4be1dbafd?w=1600&q=80","credit":"Xavier Coiffic, Unsplash License","quelle":"https://unsplash.com/photos/green-and-black-rock-formation-on-blue-sea-under-blue-and-white-cloudy-sky-during-daytime-Qxxv8M2_aNI"}},{"tag":9,"ort":"Westküste","titel":"Kreolisch kochen, mild bitte","energie":"mittel","text":"Vormittag faul. Am Nachmittag ein kreolischer Kochkurs an der Küste: Rougaille, Linsen-Dholl, Kokos-Chatini, gekocht über Holzfeuer. Das Chili kommt in ein eigenes Schälchen, und ihr esst, was ihr selbst gekocht habt.","highlights":["Kochkurs über Holzfeuer","Essen mit Meerblick"],"tipp":"Ein Kurs an der Küste kostet ca. 78 USD p. P. (recherchiert, Anbieter und Bewertungen vor Buchung prüfen). Bei der Buchung gleich ‚ohne Schärfe‘ angeben.","bild":{"url":"https://images.unsplash.com/photo-1562522513-a22a63a0e21e?w=1600&q=80","credit":"Oumar Ramjean, Unsplash License","quelle":"https://unsplash.com/photos/v3CbbIT-Gl4"}},{"tag":10,"ort":"Westküste","titel":"Dinner am leeren Strand","energie":"ruhig","text":"Euer zweiter Muss-Moment: tagsüber nichts außer Strand und Pool, ab 17 Uhr ein gedeckter Tisch im Sand, Fackeln, Koch, und die Sonne versinkt um ca. 17:40 im Meer. Danach seid ihr zu zweit, die Brandung ist die einzige Musik.","highlights":["Privates Sonnenuntergangs-Dinner","Strandtag ohne Programm"],"tipp":"Strände auf Mauritius sind öffentlich (Annahme), ganz allein seid ihr selten: einen Wochentag und einen ruhigen Abschnitt wählen. Über die Villa einen Privatkoch oder bei einem Strandrestaurant ein Privat-Setup buchen, ca. 200–400 € für zwei (Schätzung). Tag 15 als Ersatztermin freihalten.","bild":{"url":"https://images.unsplash.com/photo-1687049417784-f5ea5659f2d6?w=1600&q=80","credit":"Heiko Kaufmann, Unsplash License","quelle":"https://unsplash.com/photos/a-white-sandy-beach-with-palm-trees-and-blue-water--qz75V7qpwU"}},{"tag":11,"ort":"Port Louis","titel":"Markt, Gewürze, Schirmgasse","energie":"mittel","text":"Früh am Wochentag in die Hauptstadt: Im Zentralmarkt türmen sich Ananas, Kokosnüsse, Vanille und Gewürze, oben gibt es Körbe und Tücher. Danach an die Caudan Waterfront mit der bunten Schirmgasse, Mittagessen am Hafen, nachmittags zurück an den Pool.","highlights":["Zentralmarkt Port Louis","Caudan Waterfront"],"tipp":"Gegen 8:30–9:00 da sein, mittags wird es voll und heiß. Wer mag, hält auf dem Rückweg am erloschenen Krater Trou aux Cerfs in Curepipe (Umweg ca. 30 min, Annahme).","bild":{"url":"https://images.unsplash.com/photo-1768734835933-89f5cb1d90b8?w=1600&q=80","credit":"Tofan Teodor, Unsplash License","quelle":"https://unsplash.com/photos/fresh-tropical-fruits-displayed-at-a-market-stall--xPQbKINGZg"}},{"tag":12,"ort":"Westküste","titel":"Spa und Palmen","energie":"ruhig","text":"Ein Tag nur für euch: Paarmassage, Lesen unter Palmen, Schwimmen in der Lagune. Abends ein entspanntes Essen in Tamarin.","highlights":["Paarmassage","Lagune vor der Tür"],"tipp":"Massage schon zu Hause für diesen Tag reservieren, dann müsst ihr vor Ort nichts organisieren.","bild":{"url":"https://images.unsplash.com/photo-1537640685236-a9df2496e232?w=1600&q=80","credit":"Xavier Coiffic, Unsplash License","quelle":"https://unsplash.com/photos/coconut-tree-near-shoreline-REz1OCM2fmY"}},{"tag":13,"ort":"Tamarin","titel":"Buckelwale vor der Küste","energie":"aktiv","text":"Am Vormittag mit einem lizenzierten Anbieter hinaus aufs offene Meer vor Tamarin. Ende Juni ziehen die ersten Buckelwale an der Westküste vorbei, mit Glück seht ihr Fontänen, Flossen und Sprünge. Nachmittags Ruhe am Pool.","highlights":["Walbeobachtung mit Abstand","Delfine vom Boot aus"],"tipp":"Hauptsaison ist Juli bis Oktober oder November, im Juni sind Sichtungen Glückssache (recherchiert, Quellen uneinheitlich). Deshalb liegt die Tour spät in der Reise. Seit 2024 gelten Genehmigungs- und Abstandsregeln (recherchiert); Schwimmen mit Walen auslassen. Kleingruppe ca. 60–100 € p. P. (Schätzung).","bild":{"url":"https://images.unsplash.com/photo-1568430462989-44163eb1752f?w=1600&q=80","credit":"Todd Cravens, Unsplash License (Symbolbild)","quelle":"https://unsplash.com/photos/humpback-whale-breaching-blue-ocean-lwACYK8ScmA"}},{"tag":14,"ort":"Trou aux Biches","titel":"Schildkröten im Nordwesten","energie":"mittel","text":"Ein Ausflug an die ruhige Lagune von Trou aux Biches, einen der bekannten Schildkröten-Spots der Insel: Korallen, bunte Fische, mit Glück eine Grüne Meeresschildkröte oder Echte Karettschildkröte. Mittagessen am Strand, zum Sonnenuntergang zurück im Westen.","highlights":["Schnorcheln in ruhigem Wasser","Chance auf Meeresschildkröten"],"tipp":"Schildkröten sind nicht garantiert (recherchiert). Ein lokaler Schnorchel-Guide kennt die Stellen. Abstand halten, nicht anfassen. Das Meer hat im Juni ca. 25 °C (recherchiert): ein Lycra-Shirt hilft gegen Auskühlen.","bild":{"url":"https://images.unsplash.com/photo-1589634749362-a8ef3056cbe9?w=1600&q=80","credit":"Naja Bertolt Jensen, Unsplash License (Symbolbild)","quelle":"https://unsplash.com/photos/sea-turtle-swimming-in-blue-water-Uu1CtKngEXY"}},{"tag":15,"ort":"Westküste","titel":"Letzter goldener Abend","energie":"ruhig","text":"Nichts mehr müssen: Pool, letzter Lagunenschwumm, Koffer packen. Fällt etwas wegen Wind aus, holt ihr es heute nach. Zum letzten Sonnenuntergang ein Glas am Pool, früh ins Bett.","highlights":["Puffertag für Dinner oder Boot","Abschied vom Sonnenuntergang"],"tipp":"Fahrer für morgen früh bestätigen, Mietwagen nach Absprache an der Villa abholen lassen oder am Flughafen abgeben.","bild":{"url":"https://images.unsplash.com/photo-1669748247295-dabb70bf7c25?w=1600&q=80","credit":"Emma Fitzgibbon, Unsplash License","quelle":"https://unsplash.com/photos/z2pdD4aSTgI"}},{"tag":16,"ort":"Heimreise","titel":"Heimflug bei Tageslicht","energie":"mittel","text":"Um ca. 5:30 los zum Flughafen (Schätzung), Abflug 08:40, Landung in Frankfurt ca. 17:45 (recherchiert, Flugplan 2026). Ein Tagflug mit Blick aufs Meer zum Abschied, abends seid ihr zu Hause, ganz ohne Jetlag.","highlights":["Letzter Blick auf die Lagune von oben","Abends zu Hause"],"tipp":"Das ist euer zweiter frühe Start und lässt sich bei diesem Flugplan nicht vermeiden. Wer ihn umgehen will, schläft die letzte Nacht in Flughafennähe, dann ist es aber eine dritte Station.","bild":{"url":"https://images.unsplash.com/photo-1513415277900-a62401e19be4?w=1600&q=80","credit":"Xavier Coiffic, Unsplash License","quelle":"https://unsplash.com/photos/aerial-photography-of-island-beside-body-of-water-ByAHlRiTQjo"}}],"warum_ihr":["Frühstück am eigenen Pool mit Grünblick: In Chamarel wohnt ihr fünf Nächte in einer Pool-Suite mitten im Bergwald. Hier fühlt sich Mauritius am meisten nach Bali an.","Einsamer Strand mit Dinner bei Sonnenuntergang: Die Westküste ist die Sonnenuntergangsseite, mit Ersatztermin falls es windig ist. Ganz menschenleer wird es an öffentlichen Stränden selten.","Wasserfall, Tempel, Markt, Kochkurs: Chamarel-Wasserfall, Grand Bassin, Zentralmarkt Port Louis und ein milder kreolischer Kochkurs sind alle drin, ohne lange Fahrten.","Meerestiere: Buckelwale zum Saisonstart und Schildkröten in Trou aux Biches, beides ehrlich Glückssache, dazu die Lagune am Crystal Rock.","Ehrliche Lücke: Es gibt keinen aktiven Vulkan und keine Reisterrassen. Ersatz sind Le Morne, der Kratersee Grand Bassin und optional der Krater Trou aux Cerfs.","Gemütlicher Rhythmus: zwei Stationen, ruhige und aktive Tage im Wechsel, höchstens zwei frühe Starts (einer davon optional)."],"liz_check":{"langstrecke":"Die sanfteste Variante: ein einziger Nonstop-Flug, ca. 11,5 h im neuen A330neo, hin über Nacht, zurück am Tag, nur +2 h Zeitunterschied (recherchiert). Gegen die Angst helfen Sitze nebeneinander, ein Gangplatz und optional Condors Premium Class als Upgrade (2026 ab ca. 430 € p. P. und Strecke, recherchiert, nicht im Budget).","insekten":"Juni ist Südwinter: vermutlich weniger Mücken als in der Regenzeit (Annahme). Im Wald von Chamarel eher mehr als an der Küste (Schätzung). Mückenschutz und Moskitonetz vorab bei der Lodge erfragen. 2025 gab es in der Region Chikungunya (recherchiert, nicht im Detail geprüft), das klärt Gesundheit.","essen":"Kreolisch, französisch, indisch und chinesisch. Schärfe kommt meist separat als Chili oder Chutney auf den Tisch (Annahme). Im Kochkurs und im Restaurant ‚pas piquant‘ sagen.","trubel":"Die Siebenfarbige Erde gleich um 8:30, den Markt früh am Wochentag, ein Privatboot statt Katamaran. Le Morne und Strände am Wochenende meiden (Annahme). Die Westküste ist ruhig, Partyszene gibt es kaum."},"wetter":{"juni":"Küste ca. 20–28 °C, ca. 25 mm Regen an 4 Tagen, ca. 7 h Sonne, Meer ca. 25 °C (recherchiert, Station Port Louis). In Chamarel kühler und feuchter: Die Hochland-Station Vacoas (425 m) zeigt 17–23 °C und 15 Regentage, Chamarel liegt tiefer und dürfte dazwischen liegen (Schätzung). Sonnenuntergang ca. 17:40 (recherchiert). Wale: Saisonbeginn, Sichtungen Glückssache.","juli":"Küste ca. 19–27 °C, Meer ca. 24 °C, windigster Monat, West- und Nordküste geschützter (recherchiert). Mehr Wale. Achtung: Ab den NRW-Somm
