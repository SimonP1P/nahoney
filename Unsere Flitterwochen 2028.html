erferien (ab 10.07.2028) steigen Flugpreise und Andrang (Schätzung).","august":"Küste ca. 19–27 °C, Meer ca. 23 °C, ca. 5 Regentage (recherchiert). Hauptzeit der Buckelwale, für Liz' Badewünsche aber spürbar frischer. Zyklone gibt es nur von November bis Mai (recherchiert, AA)."},"einreise_gesundheit":["Deutscher Reisepass: visumfrei als Tourist. Der Pass muss noch 6 Monate über das Reiseende hinaus gültig sein (recherchiert, Auswärtiges Amt, Stand Nov. 2026). Welchen Pass Liz hat, ist offen. Bei einem Namenswechsel nach der Hochzeit Ticketname und Pass abgleichen.","Vor dem Abflug online das ‚All in One Travel Form‘ ausfüllen (recherchiert, AA).","Direktflug, also kein Transitland und keine Transitregeln.","Sicherheitslage: Im Oktober 2026 gab es gewaltsame Unruhen mit Straßenblockaden. Die nächtliche Ausgangssperre wurde am 19.10.2026 aufgehoben, die Sicherheitskräfte bleiben verstärkt im Einsatz (recherchiert, AA). Vor der Buchung und vor dem Abflug erneut prüfen.","Gesundheit: Chikungunya-Übertragung in der Region 2024/25 (recherchiert, nicht im Detail geprüft). Impfungen und Mückenschutz mit Hausärztin oder Tropeninstitut klären (offen).","Drohne: Laut Quellen braucht ihr Genehmigungen von Luftfahrtbehörde DCA und Regulierungsbehörde ICTA, die Angaben sind uneinheitlich (recherchiert). Lieber zu Hause lassen."],"budget_posten":[{"posten":"Flüge Condor Economy mit Gepäck und Sitzplätzen, Rail&Fly (Schätzung, 2026 ab 299,99 € p. P. und Strecke, recherchiert; ein ‚ab‘-Preis ist kein Endpreis)","von":1600,"bis":2300},{"posten":"Chamarel, 5 Nächte Pool-Suite mit Frühstück (Schätzung)","von":1500,"bis":2000},{"posten":"Westküste, 9 Nächte Villa mit Privatpool, Frühstück selbst (Schätzung, Sparhebel eingerechnet)","von":1150,"bis":1900},{"posten":"Essen und Trinken (Schätzung)","von":900,"bis":1300},{"posten":"Fahrer am Ankunftstag plus Mietwagen ca. 12 Tage mit Vollkasko und Benzin (Schätzung)","von":450,"bis":700},{"posten":"Aktivitäten: Privatboot Lagune, Wale, Geopark, Kochkurs, Spa, Strand-Dinner (Schätzung)","von":750,"bis":1200},{"posten":"Gebühren: Touristenabgabe ca. 3 € p. P. und Nacht (recherchiert), Eintritte","von":90,"bis":130},{"posten":"Reiseversicherung mit Rücktritt (Schätzung)","von":200,"bis":350},{"posten":"Puffer ca. 10 % (Preissteigerung von ca. 6 % ist in allen Posten schon enthalten)","von":660,"bis":990}],"risiken":[{"risiko":"Kühler als erhofft: Chamarel ist im Juni feucht und morgens frisch, der Pool womöglich kalt, das Meer nur ca. 24–25 °C.","gegenmassnahme":"Die Reise so früh wie möglich legen (Juni statt Juli/August), einen beheizten Pool schriftlich zusagen lassen, sonst Lodge-Villa oder Küste. Lycra-Shirt und Strickjacke einpacken."},{"risiko":"Politische Lage: Nach den Unruhen im Oktober 2026 sind neue Ausgangssperren kurzfristig möglich.","gegenmassnahme":"AA-Hinweise bis 2028 verfolgen, flexible Tarife und eine Rücktrittsversicherung buchen, Unterkünfte mit kostenloser Stornierung wählen."},{"risiko":"Budget kippt: Die Lodge-Rate oder die Juni-Flüge liegen am oberen Ende, dann seid ihr bei über 10.000 €.","gegenmassnahme":"Zwei Sparhebel: (1) In Chamarel 3 Nächte Pool-Suite und 2 Nächte Kaz Standard, spart ca. 250–400 € (Schätzung; Pool-Frühstück bleibt dann auf 3 Tage begrenzt). (2) Flüge buchen, sobald der Flugplan 2028 offen ist; Condor nennt Juni als günstigen Monat (recherchiert)."},{"risiko":"Flugplan 2028 unbekannt: Condor könnte Flugtage oder Abflugzeiten ändern.","gegenmassnahme":"Hochzeitsdatum und Flugplan zusammen festzurren, bis dahin nur stornierbar reservieren."},{"risiko":"Wale und Schildkröten bleiben aus.","gegenmassnahme":"Die Waltour liegt spät in der Reise und ist kein Kernstück. Ersatz: eine zweite Lagunentour oder Schnorcheln mit Guide."}],"plan_b":"Wetterabhängig sind Strand-Dinner, Bootstour und Waltour. Tag 15 ist dafür der Ersatztag, die freien Tage 9 und 12 lassen sich tauschen. Ist es am Dinner-Abend windig oder regnet es, findet das Dinner mit Privatkoch im Garten der Villa am Pool statt, oder auf der Aussichtsterrasse in Chamarel. Bei Regen in Chamarel: Rum-Destillerie, Spa und das Museum ‚Curious Corner‘ (Annahme), sonst früher an die trockenere Westküste wechseln.","quellen":[{"titel":"Auswärtiges Amt: Mauritius, Reise- und Sicherheitshinweise","url":"https://www.auswaertiges-amt.de/de/reiseundsicherheit/mauritiussicherheit-206994","stand":"2026-11-07"},{"titel":"Condor: Flüge Frankfurt–Mauritius","url":"https://www.condor.com/de/fluege/mauritius/von-frankfurt-main/","stand":"2026-11-07"},{"titel":"Reisetopia: Condor erhöht Frequenzen Sommer 2026","url":"https://reisetopia.de/news/condor-erhoeht-frequenzen-sommer-2026/amp/","stand":"2026-11-07"},{"titel":"Lakaz Chamarel Exclusive Lodge (Zimmerkategorien)","url":"https://www.lakazchamarel.com/","stand":"2026-11-07"},{"titel":"Climates to Travel: Klima Mauritius","url":"https://climatestotravel.com/climate/mauritius","stand":"2026-11-07"},{"titel":"Chamarel 7 Coloured Earth Geopark: FAQ, Öffnungszeiten","url":"https://chamarel7colouredearth.com/faq","stand":"2026-11-07"},{"titel":"HIDMC: Walbeobachtung auf Mauritius","url":"https://www.hidmc.com/blog-posts/whale-watching-in-mauritius-best-times-tour-operators","stand":"2026-11-07"},{"titel":"Snaptrip: Searenity Villas, La Preneuse","url":"https://www.snaptrip.com/properties/mauritius/black-river-district/grande-riviere-noire/searenity-villas","stand":"2026-11-07"},{"titel":"Santé publique France: Chikungunya La Réunion 2024–2025","url":"https://www.santepubliquefrance.fr/regions-et-territoires/ocean-indien/article/genomic-insights-re-emergence-chikungunya-virus-reunion-island-france-2024-2025","stand":"2026-11-07"},{"titel":"Unsplash, Fotoseiten der Bilder (Links je Tag)","url":"https://unsplash.com/s/photos/le-morne-mauritius","stand":"2026-11-07"}]},{"id":"D","titel":"Sizilien und die Liparischen Inseln","untertitel":"Vulkane, Zitronen und Meer ohne Langstrecke: Frühstück am Pool im Mandarinenhain, Lava vom Boot aus und zum Schluss goldener Barock.","farbe":"#F2C12E","hero":{"url":"https://images.unsplash.com/photo-1752220188164-95a4fe81135f?w=1600&q=80","credit":"Sara Abilova, Unsplash-Lizenz (Zitronenbaum vor weißem Haus, Stromboli)","quelle":"https://unsplash.com/photos/a-lemon-tree-stands-near-a-white-house-MnN9lMtHzEo"},"eckdaten":{"monat":"Juni 2028","naechte":15,"budget_von":8200,"budget_bis":13370,"budget_mitte":10400,"ampel":"darüber","anreise":"Direktflug Frankfurt–Catania mit Lufthansa, ca. 2:35 h, ganzjährig (recherchiert); alternativ Düsseldorf–Catania mit Eurowings, ca. 2:40 h, Frequenz 2028 offen (recherchiert); ab Amsterdam (offen). Dann Mietwagen.","zeitverschiebung":"keine (0 h)","stopover":""},"stationen":[{"name":"Pozzillo bei Acireale (Ostküste, zwischen Ätna und Meer)","land":"Italien","naechte":5,"lat":37.655,"lon":15.19,"unterkunft":"Eco-Lodge oder Pool-Villa mit eigenem Pool im Zitrushain","beispiele":[{"name":"Mantàri Eco Lodges (nur Erwachsene)","warum":"Neun freistehende Lodges zwischen Mandarinen- und Avocadobäumen, jede mit eigenem beheiztem Pool (ca. 3 × 6 m), Terrasse mit Meer- oder Ätnablick, Küche, nur Erwachsene (recherchiert). Bewertungen 9,9/10 (55) bzw. 8,6/10 (402) je nach Portal (recherchiert).","preis":"ca. 250 bis 400 €/Nacht (Schätzung, kein Preis gefunden)","url":"https://www.icastelli.net/en/mantari-eco-lodges"},{"name":"Zash Country Boutique Hotel & Spa, Pool Villa (Riposto)","warum":"Pool Villa mit 40 m², eigenes Gebäude im Zitrushain, auf der einen Seite der Ätna, auf der anderen das Meer, privater Tauchpool mit Massagedüsen (recherchiert). Upgrade-Option.","preis":"ca. 450 bis 700 €/Nacht (Schätzung)","url":"https://www.icastelli.net/en/zash-country-boutique-hotel/redirect/rooms"}]},{"name":"Salina (Liparische Inseln), Malfa oder Santa Marina","land":"Italien","naechte":4,"lat":38.577,"lon":14.835,"unterkunft":"Boutique-Hotel mit Panoramapool und Meerblick-Terrasse (auf Salina kein Privatpool zu finden)","beispiele":[{"name":"Hotel Signum (Malfa)","warum":"Infinity-Pool, Gärten mit Bougainvillea, Zimmer mit Blick auf Panarea und Stromboli oder Richtung Pollara und Sonnenuntergang; Villa Suite (55 m²) mit Terrasse und Whirlpool-Wanne (recherchiert). Pool geteilt, Spa im Haus (Annahme).","preis":"ab ca. 350 €/Nacht im Juni (Schätzung, aus einem Juni-Datenpunkt in NZ$, Jahr unklar)","url":"https://www.mrandmrssmith.com/luxury-hotels/hotel-signum/rooms"},{"name":"Halgoduria (Santa Marina Salina)","warum":"Restaurierte Villa mit 5 Zimmern, nur Erwachsene, Panoramapool, Whirlpool, meist private Terrasse mit Meerblick, 4 Gehminuten zum Hafen (recherchiert). Günstiger und ideal für Bootstage.","preis":"ca. 200 bis 350 €/Nacht (Schätzung)","url":"https://www.icastelli.net/it/halgoduria"},{"name":"Therasia Resort (Vulcano), Pool Suite","warum":"Einzige Insel-Option mit privatem Tauchpool bzw. Whirlpool auf der Terrasse, Quellen widersprechen sich aber (recherchiert). Nur falls der Privatpool auch auf der Insel Pflicht ist.","preis":"ca. 400 bis 700 €/Nacht (Schätzung)","url":""}]},{"name":"Noto (Val di Noto, Südosten)","land":"Italien","naechte":6,"lat":36.875,"lon":15.075,"unterkunft":"Landhaus-Suite oder Villa mit eigenem Pool zwischen Oliven und Mandeln","beispiele":[{"name":"Country House Villadorata, Ulivo Residence","warum":"Ganz private Suite (37 m²) 170 m vom Haupthaus, eigener Pool 12 × 3 m mit Terrasse, Meerblick, 4 km bis Noto, ca. 20 Min. bis Vendicari, ca. 1 h bis Flughafen Catania (recherchiert).","preis":"ca. 280 bis 450 €/Nacht (Schätzung)","url":"https://www.welcomebeyond.com/property/country-house-villadorata/"},{"name":"Braccialieri, Pool Suite Amare","warum":"70 m², eigener Pool und Veranda mit Liegen (recherchiert). Luxus-Upgrade.","preis":"750 €/Nacht (recherchiert, Stand 2026)","url":"https://www.welcomebeyond.com/property/braccialieri/"},{"name":"Villa Manghisi (Sparvariante)","warum":"Eigenes Haus (100 m²) mit eigenem Pool und ca. 1.000 m² grünem Garten, abgelegen zwischen Noto und Palazzolo Acreide, ca. 20 km zum Meer (recherchiert).","preis":"ab 170 €/Nacht (recherchiert, ab-Preis, Stand 2026)","url":"https://www.isulatravel.com/villa-manghisi-noto?page=0"}]}],"wege":[{"von":"Frankfurt oder Düsseldorf","nach":"Catania","art":"Flug","dauer":"ca. 2:35 bis 2:40 h, direkt (recherchiert)"},{"von":"Flughafen Catania","nach":"Pozzillo","art":"Auto","dauer":"ca. 35 bis 45 Min. (Schätzung)"},{"von":"Pozzillo","nach":"Milazzo","art":"Auto","dauer":"ca. 1:30 bis 1:45 h über die Autobahn (Schätzung)"},{"von":"Milazzo","nach":"Salina","art":"Boot","dauer":"Tragflügelboot ca. 1:35 bis 1:50 h (recherchiert)"},{"von":"Salina","nach":"Milazzo","art":"Boot","dauer":"ca. 1:35 bis 1:50 h (recherchiert)"},{"von":"Milazzo","nach":"Noto","art":"Auto","dauer":"ca. 3 h, rund 250 km Autobahn (Schätzung)"},{"von":"Noto","nach":"Flughafen Catania","art":"Auto","dauer":"ca. 1 h (recherchiert)"},{"von":"Catania","nach":"Frankfurt oder Düsseldorf","art":"Flug","dauer":"ca. 2:30 bis 2:40 h, direkt (recherchiert)"}],"tage":[{"tag":1,"ort":"Pozzillo","titel":"Zweieinhalb Stunden bis zum eigenen Pool","energie":"ruhig","text":"Direktflug nach Catania, keine Zeitumstellung, kein Umstieg. Mietwagen abholen, 40 Minuten die Küste hinauf, und am späten Nachmittag liegt ihr am eigenen Pool zwischen Mandarinenbäumen, der Ätna im Rücken. Abends ein Aperitivo auf der Terrasse, mehr nicht.","highlights":["Erster Sprung in den eigenen Pool","Aperitivo mit Ätna-Blick"],"tipp":"Check-in bei Mantàri laut Angabe 16 bis 19:30 Uhr (recherchiert): Flug am Vormittag oder Mittag wählen.","bild":{"url":"https://images.unsplash.com/photo-1751872236347-161a50ca6e1b?w=1600&q=80","credit":"Sara Abilova, Unsplash-Lizenz (Symbolbild: Pool mit Zitronenbaum, Sizilien)","quelle":"https://unsplash.com/photos/lemon-tree-thrives-between-lounge-chairs-near-a-pool-AqZ8RYPaRg4"}},{"tag":2,"ort":"Pozzillo und Acireale","titel":"Frühstück im Zitrusduft","energie":"ruhig","text":"Euer erstes Frühstück am eigenen Pool: Orangensaft, Ricotta, Zitrusduft, Meer im Blick. Den Tag über nur Lesen, Schwimmen, Schlafen. Gegen Abend nach Acireale: Barockplatz, Granita mit Brioche, Passeggiata mit den Einheimischen.","highlights":["Frühstück am Privatpool mit Grünblick","Granita auf der Piazza in Acireale"],"tipp":"Granita isst man hier auch zum Frühstück: Mandel oder Zitrone.","bild":{"url":"https://images.unsplash.com/photo-1751972774281-34f966e9d21e?w=1600&q=80","credit":"Sara Abilova, Unsplash-Lizenz (Symbolbild: Poolgarten in Sizilien)","quelle":"https://unsplash.com/photos/a-luxury-pool-and-loungers-in-a-garden-f13vM9-CGtM"}},{"tag":3,"ort":"Taormina und Isola Bella","titel":"Theater über dem Meer, Bad an der Isola Bella","energie":"mittel","text":"Früh los, gegen 8 Uhr seid ihr in Taormina, bevor die Tagesgäste kommen: Corso Umberto und das griechische Theater mit Ätna und Meer als Kulisse. Danach hinunter zur Isola Bella, baden in klarem Türkis, Mittagessen am Wasser. Nachmittags zurück an den Pool.","highlights":["Teatro Antico mit Ätna-Blick","Baden an der Isola Bella"],"tipp":"Taormina ist ab dem späten Vormittag voll (Schätzung). Ruhigere Alternative: Castelmola oberhalb, oder die Isola Bella erst nach 17 Uhr.","bild":{"url":"https://images.unsplash.com/photo-1724333659097-22cbc8b77346?w=1600&q=80","credit":"Marco Biondi, Unsplash-Lizenz (Isola Bella, von Taormina aus)","quelle":"https://unsplash.com/photos/a-small-island-in-the-middle-of-a-body-of-water-TRs92-bosSA"}},{"tag":4,"ort":"Ätna","titel":"Sonnenuntergang auf dem Vulkan","energie":"aktiv","text":"Vormittags faul, am Nachmittag mit Führer auf den Ätna: im Geländewagen über die Nordflanke, zu Fuß durch eine Lavahöhle und über erkaltete Lavaströme. Zum Sonnenuntergang steht ihr über den Wolken oder über der Küste. Ein Vulkan ohne Wecker, passend für Spättypen.","highlights":["Sonnenuntergang auf rund 2.000 m (Schätzung)","Lavahöhle und schwarze Lavafelder"],"tipp":"Abends oben teils unter 10 °C (Schätzung): Fleecejacke und feste Schuhe. Ohne Führer nur bis ca. 2.750 m, darüber Führerpflicht (recherchiert, Quellen uneinheitlich).","bild":{"url":"https://images.unsplash.com/photo-1566515706327-d8900c9bf2fd?w=1600&q=80","credit":"Andrea Campagna, Unsplash-Lizenz (Symbolbild: Krater auf Vulcano, nicht Ätna)","quelle":"https://unsplash.com/photos/aerial-view-of-island-u_94gGeMNqA"}},{"tag":5,"ort":"Pozzillo","titel":"Letzter Tag im Mandarinenhain","energie":"ruhig","text":"Ausschlafen, Pool, vielleicht eine Massage. Wer Lust auf Wasser hat, fährt früh zur Alcantara-Schlucht: Basaltsäulen und eiskaltes Flusswasser, so etwas wie ein Wasserfall-Ersatz. Am Nachmittag eine kleine Weinprobe mit Etna Rosso und Carricante.","highlights":["Gole dell'Alcantara (optional)","Ätna-Wein am Nachmittag"],"tipp":"Alcantara vor 10 Uhr ist ruhiger (Schätzung); Wasserschuhe mitnehmen.","bild":{"url":"https://images.unsplash.com/photo-1752220188164-95a4fe81135f?w=1600&q=80","credit":"Sara Abilova, Unsplash-Lizenz (Symbolbild: Zitronenbaum, Stromboli)","quelle":"https://unsplash.com/photos/a-lemon-tree-stands-near-a-white-house-MnN9lMtHzEo"}},{"tag":6,"ort":"Milazzo nach Salina","titel":"Übers Meer auf die grüne Insel","energie":"mittel","text":"Nach dem Frühstück eineinhalb Stunden nach Milazzo, Auto ins Parkhaus, dann mit dem Tragflügelboot in gut eineinhalb Stunden vorbei an Vulcano und Lipari nach Salina. Die grünste der Liparischen Inseln: Kapern, Malvasia-Reben, zwei erloschene Vulkankegel. Ankommen, Spritz auf der Terrasse über dem Meer.","highlights":["Bootsfahrt an Vulcano und Lipari vorbei","Malvasia zur Begrüßung"],"tipp":"Liberty-Lines-Tickets vorab buchen, Fahrplan für 2028 offen. Parken in Milazzo ca. 15 bis 25 €/Tag (Schätzung).","bild":{"url":"https://images.unsplash.com/photo-1693659086999-fd1337f06797?w=1600&q=80","credit":"Reegan Fraser, Unsplash-Lizenz (Boot vor Lipari)","quelle":"https://unsplash.com/photos/an-aerial-view-of-a-boat-in-a-body-of-water-GFEF95CoLqY"}},{"tag":7,"ort":"Salina","titel":"Spa und die Bucht von Pollara","energie":"ruhig","text":"Ausschlafen, Spa-Nachmittag, Pool mit Blick auf Panarea und Stromboli. Zum Sonnenuntergang nach Pollara: Die halbe Kraterbucht leuchtet orange, die Sonne sinkt hinter Filicudi und Alicudi ins Meer. Danach Abendessen in Malfa.","highlights":["Spa-Nachmittag","Sonnenuntergang über Pollara"],"tipp":"Der Strand von Pollara war wegen Steinschlag zeitweise gesperrt (Annahme, vor Ort prüfen): Der Aussichtspunkt oben ist ohnehin der schönste Platz.","bild":{"url":"https://images.unsplash.com/photo-1780989863126-cd4dd0d74211?w=1600&q=80","credit":"Sara Abilova, Unsplash-Lizenz (Liparische Inseln, Symbolbild für Salina)","quelle":"https://unsplash.com/photos/green-mountain-overlooks-a-white-building-and-tall-pine-tree-exB7P-vq7dw"}},{"tag":8,"ort":"Salina und Lipari, auf dem Wasser","titel":"Eine Bucht nur für euch zwei","energie":"aktiv","text":"Privatboot mit Skipper rund um Salina und hinüber zur Westküste von Lipari: Badestopps in Buchten, die man nur vom Wasser erreicht, Schnorcheln über Lavafels. Zum Sonnenuntergang ankert ihr in einer leeren Bucht an Salinas Westseite, Dinner an Bord mit Fisch, Kapern und Malvasia. Das ist euer einsamer Strand mit Sonnenuntergangs-Dinner, nur eben vom Wasser aus.","highlights":["Einsame Bucht, Sonnenuntergang über dem Meer","Dinner an Bord"],"tipp":"Privatboot mit Dinner früh anfragen, Preis offen (Schätzung 450 bis 800 € für zwei). Bei Wind mit Tag 9 tauschen.","bild":{"url":"https://images.unsplash.com/photo-1612834853504-f50db27428f4?w=1600&q=80","credit":"Lyle Wilkinson, Unsplash-Lizenz (Blick vom Gran Cratere auf Lipari und Salina)","quelle":"https://unsplash.com/photos/green-grass-field-near-body-of-water-under-blue-sky-during-daytime-4gGfDZZVgPk"}},{"tag":9,"ort":"Panarea und Stromboli","titel":"Lava im Nachthimmel","energie":"mittel","text":"Vormittags faul, mittags Pane cunzato und Granita in Lingua. Am Nachmittag Bootstour über Panarea nach Stromboli: Badestopp, Abendessen im Dorf, dann treibt das Boot vor der Sciara del Fuoco, und der Vulkan wirft glühende Lava in den Nachthimmel. Rückkehr gegen Mitternacht (Schätzung).","highlights":["Lavaausbrüche vom Boot aus","Panarea im Abendlicht"],"tipp":"Strombolis Gipfel ist gesperrt, frei nur bis 290 m, mit Führer bis 400 m (recherchiert, Verordnung von 2025, kann sich ändern). Vom Boot aus seht ihr ohnehin am meisten. Warme Jacke für die Rückfahrt.","bild":{"url":"https://images.unsplash.com/photo-1752221719398-d98565bca8be?w=1600&q=80","credit":"Sara Abilova, Unsplash-Lizenz (Vulkanküste von Stromboli)","quelle":"https://unsplash.com/photos/a-steep-volcanic-coast-meets-the-tranquil-ocean-igX53eKeXXM"}},{"tag":10,"ort":"Salina nach Noto","titel":"Der eine lange Reisetag","energie":"mittel","text":"Boot am Vormittag nach Milazzo, dann rund drei Stunden Autobahn in den Südosten. Am späten Nachmittag rollt ihr durch Olivenhaine zur Villa, springt in den eigenen Pool und esst im Garten. Ehrlich gesagt der anstrengendste Tag der Reise, danach kommt nur noch Ruhe.","highlights":["Ankommen im Olivenhain","Abend am eigenen Pool"],"tipp":"Boot gegen 10 Uhr nehmen und vor Sonnenuntergang ankommen (Schätzung). Ab hier ist Simon der einzige Fahrer (Annahme): Pausen einplanen.","bild":{"url":"https://images.unsplash.com/photo-1686431725439-c17fb151f442?w=1600&q=80","credit":"Joshua Kettle, Unsplash-Lizenz (Stromboli, Symbolbild Abschied von den Inseln)","quelle":"https://unsplash.com/photos/a-view-of-a-village-on-a-cliff-near-the-ocean-T3BWn6RF5pY"}},{"tag":11,"ort":"Noto, Villa","titel":"Zwölf Meter Pool und Mandelbäume","energie":"ruhig","text":"Frühstück am eigenen Pool, Blick über Oliven- und Mandelbäume bis zum Meer. Kein Programm, kein Auto. Lesen, Schwimmen, Siesta, abends Wein auf der Terrasse, während das Land golden wird.","highlights":["Frühstück am Privatpool mit Grünblick","Goldene Stunde auf der Terrasse"],"tipp":"","bild":{"url":"https://images.unsplash.com/photo-1751972774281-34f966e9d21e?w=1600&q=80","credit":"Sara Abilova, Unsplash-Lizenz (Symbolbild: Poolgarten in Sizilien)","quelle":"https://unsplash.com/photos/a-luxury-pool-and-loungers-in-a-garden-f13vM9-CGtM"}},{"tag":12,"ort":"Noto","titel":"Kochkurs und goldener Barock","energie":"mittel","text":"Vormittags Kochkurs: Caponata, frische Pasta, Cannoli mit Ricotta, danach esst ihr zusammen. Zur goldenen Stunde nach Noto, wenn die Tagesbusse weg sind: die Kathedrale, die Balkone der Via Nicolaci, Blick von einer Kirchenterrasse über die honigfarbenen Dächer.","highlights":["Gemeinsamer Kochkurs","Noto im Abendlicht"],"tipp":"Kochkurs vorab buchen, Anbieter offen. Mandelgranita in Noto ist Pflicht.","bild":{"url":"https://images.unsplash.com/photo-1752220188164-95a4fe81135f?w=1600&q=80","credit":"Sara Abilova, Unsplash-Lizenz (Symbolbild: Zitronenbaum, Stromboli)","quelle":"https://unsplash.com/photos/a-lemon-tree-stands-near-a-white-house-MnN9lMtHzEo"}},{"tag":13,"ort":"Vendicari und Marzamemi","titel":"Lagunen, Badebucht, Fischerdorf","energie":"mittel","text":"Früh ins Naturschutzgebiet Vendicari: Holzstege an Lagunen entlang, ein alter Thunfischturm, dann die Bucht Calamosche mit hellem Sand und klarem Wasser. Mittags Siesta am Pool, abends Aperitivo im Fischerdorf Marzamemi.","highlights":["Badebucht Calamosche","Aperitivo in Marzamemi"],"tipp":"Vendicari vor 10 Uhr (Schätzung), Wasser und Schatten mitbringen, es gibt keine Strandbar. Meeresschildkröten nisten an manchen Stränden im Südosten (Annahme): markierte Nester meiden, Begegnungen im Wasser sind nicht planbar.","bild":{"url":"https://images.unsplash.com/photo-1724333659097-22cbc8b77346?w=1600&q=80","credit":"Marco Biondi, Unsplash-Lizenz (Symbolbild: Isola Bella, nicht Vendicari)","quelle":"https://unsplash.com/photos/a-small-island-in-the-middle-of-a-body-of-water-TRs92-bosSA"}},{"tag":14,"ort":"Ortigia (Syrakus)","titel":"Markt, Tempel und Meer","energie":"mittel","text":"Ortigia ist eine Altstadtinsel aus hellem Stein: Am Vormittag der Markt mit Zitronen, Pistazien, Fisch und Käse, dann der Dom, in dem die Säulen eines griechischen Athena-Tempels stehen. Mittagessen am Wasser, Spaziergang zur Arethusa-Quelle mit Papyrus.","highlights":["Markt von Ortigia","Dom mit Tempelsäulen"],"tipp":"Der Markt ist nur vormittags, sonntags vermutlich geschlossen (Annahme). Ca. 40 Min. ab Noto (Schätzung).","bild":{"url":"https://images.unsplash.com/photo-1586854512767-5690f166afb5?w=1600&q=80","credit":"Jacob Buchhave, Unsplash-Lizenz (Ortigia von oben)","quelle":"https://unsplash.com/photos/aerial-view-of-white-building-near-body-of-water-during-daytime-MeJ_KJyUSl8"}},{"tag":15,"ort":"Noto, Villa","titel":"Dinner unter Olivenbäumen","energie":"ruhig","text":"Der letzte volle Tag gehört nur euch: Pool, Massage auf der Terrasse, Fotos im goldenen Licht. Abends ein privates Dinner im Villagarten mit Kerzen, Fisch und Nero d'Avola.","highlights":["Massage an der Villa","Privates Abschiedsdinner"],"tipp":"Privatkoch oder Dinner im Garten früh anfragen, Preis offen.","bild":{"url":"https://images.unsplash.com/photo-1751872236347-161a50ca6e1b?w=1600&q=80","credit":"Sara Abilova, Unsplash-Lizenz (Symbolbild: Pool mit Zitronenbaum, Sizilien)","quelle":"https://unsplash.com/photos/lemon-tree-thrives-between-lounge-chairs-near-a-pool-AqZ8RYPaRg4"}},{"tag":16,"ort":"Noto nach Hause","titel":"Heim ohne Jetlag","energie":"ruhig","text":"Ein letztes Frühstück am Pool, dann eine Stunde zum Flughafen Catania, Mietwagen zurück, zweieinhalb Stunden Flug. Am Nachmittag seid ihr zu Hause, ohne Jetlag.","highlights":["Letzter Pool-Morgen","Kurzer Direktflug"],"tipp":"Mindestens 2 h vor Abflug am Flughafen. Am Vorabend Flugstatus prüfen, Ätna-Asche kann Catania kurz schließen (recherchiert).","bild":{"url":"https://images.unsplash.com/photo-1751972774281-34f966e9d21e?w=1600&q=80","credit":"Sara Abilova, Unsplash-Lizenz (Symbolbild: Poolgarten in Sizilien)","quelle":"https://unsplash.com/photos/a-luxury-pool-and-loungers-in-a-garden-f13vM9-CGtM"}}],"warum_ihr":["Frühstück am eigenen Pool mit Grünblick an 11 von 15 Morgen: Mandarinenhain bei Mantàri und Oliven und Mandeln an der Villadorata. Auf Salina nur geteilter Infinity-Pool, das ist der ehrliche Kompromiss.","Einsames Dinner bei Sonnenuntergang: Privatboot in einer leeren Bucht vor Salinas Westküste, wo die Sonne im Meer versinkt. An der Ostküste geht sie über Land unter, dort gibt es das Dinner im Villagarten.","Vulkan ohne Weckerqual: Ätna bei Sonnenuntergang und Stromboli-Lava bei Nacht vom Boot aus, beides passt zum Spättyp.","Liz' Wunschliste: Markt in Ortigia, Spa auf Salina, Kochkurs in Noto, Fotospots von Isola Bella bis zum Barock von Noto, Strandtage in Vendicari.","Kein Langstreckenflug, keine Zeitverschiebung, keine Tropenkrankheiten, milde Küche. Das nimmt den Druck aus der ersten Reise als Ehepaar.","Was fehlt: Dschungel, Reisterrassen und echte Wasserfälle (nur die Alcantara-Schlucht), Schildkröten beim Schnorcheln eher Glückssache, kein exotisches Bali-Gefühl."],"liz_check":{"langstrecke":"Entfällt: 2,5 h Direktflug, keine Zeitverschiebung. Kehrseite: Die Flugangst wird nur vertagt, nicht überwunden, falls ihr später Fernreisen wollt. Zwei Tragflügelbootfahrten von je ca. 1:40 h können bei Seegang schaukeln.","insekten":"Weit weniger als in den Tropen, keine Tropenkrankheiten. Abends Mücken in Gärten und an Pools möglich, auch Tigermücken (Schätzung). Klimaanlage und Mückenspray reichen, auf den Inseln oft windig.","essen":"Sizilianisch ist mild: Pasta alla Norma, Fisch, Arancini, Caponata, Granita, Cannoli. Scharfes kommt meist separat. Mit dem Satz senza piccante seid ihr auf der sicheren Seite.","trubel":"Juni liegt vor dem Andrang im Juli und August (Schätzung). Voll werden Taormina und die Isola Bella, deshalb früh am Morgen. Salina ist die ruhige Insel (Annahme), Noto ist abends nach den Bussen ruhig."},"wetter":{"juni":"Catania: ca. 26 °C am Tag, 20 °C in der Nacht, ca. 10 h Sonne (recherchiert). Meer ca. 22 bis 24 °C (Schätzung, Quellen weichen 1 bis 3 °C ab). Kaum Regen, auf den Inseln windiger und frischer. Auf dem Ätna-Gipfel abends kalt.","juli":"Ca. 30 °C am Tag, 23 bis 24 °C nachts, ca. 11 h Sonne (recherchiert). Heißer, ab Mitte Juli italienische Ferien, Unterkünfte teurer, Waldbrandgefahr steigt. Programm nur morgens und abends.","august":"Ca. 30 °C, Hitzewellen mit Scirocco möglich (Schätzung). Höchstpreise und volle Inseln rund um Ferragosto (15.08.). Für diese Reise der schlechteste Monat."},"einreise_gesundheit":["Simon (deutscher Pass): Reise innerhalb der EU, Personalausweis oder Reisepass reicht (Annahme nach EU-Freizügigkeit; die Einreiseseite des Auswärtigen Amts vor der Buchung prüfen). Sein J-1-Status in den USA zählt nur, falls er 2028 aus den USA anreist oder dorthin zurückfliegt (offen).","Liz: Staatsangehörigkeit steht nicht im Board (offen). Mit EU-Pass gilt dasselbe wie für Simon, sonst die Schengen-Regeln personenbezogen prüfen.","Gesundheit: Für Italien keine besonderen Reiseimpfungen bekannt (Annahme, Standardimpfungen mit der Hausärztin prüfen). Europäische Krankenversicherungskarte (EHIC) mitnehmen, dazu eine private Auslandskrankenversicherung mit Rücktransport.","Sicherheit laut Auswärtigem Amt (Stand Anfang November 2026, recherchiert): Ätna und Stromboli können den Flugverkehr stören. Taschendiebstahl in Touristenzonen, häufig Autoaufbrüche, nichts sichtbar im Auto lassen. Zuletzt Versorgungsengpässe an Tankstellen im Süden.","Vulkanregeln: Ätna ohne Führer bis ca. 2.750 m, darüber Führerpflicht (recherchiert, Quellen uneinheitlich). Stromboli frei bis 290 m, mit Führer bis 400 m, Sentiero Natura gesperrt (recherchiert, Verordnung Lipari Nr. 16 vom Mai 2025, kann sich ändern).","Seekrankheit auf Tragflügelbooten: Vorbeugung mit Ärztin oder Apotheke klären."],"budget_posten":[{"posten":"Flüge direkt FRA oder DUS nach CTA, hin und zurück, 2 Personen mit Koffer (Schätzung)","von":500,"bis":850},{"posten":"Unterkunft 15 Nächte: 5 × Pozzillo, 4 × Salina, 6 × Noto, meist mit Frühstück (Schätzung)","von":3600,"bis":6000},{"posten":"Mietwagen 15 Tage mit Vollkasko ohne Selbstbeteiligung, Sprit, Maut, Parken in Milazzo (Schätzung)","von":700,"bis":1000},{"posten":"Tragflügelboot Milazzo–Salina hin und zurück, 2 Personen (Schätzung)","von":100,"bis":160},{"posten":"Essen und Getränke (Schätzung)","von":1100,"bis":1600},{"posten":"Aktivitäten: Ätna mit Führer, Privatboot mit Dinner, Stromboli bei Nacht, Kochkurs, Spa, Privatdinner (Schätzung)","von":800,"bis":1400},{"posten":"Gebühren: Kurtaxe, Landungsabgabe Liparische Inseln (Schätzung)","von":80,"bis":150},{"posten":"Reiserücktritts- und Abbruchversicherung (Schätzung)","von":150,"bis":300},{"posten":"Preissteigerung bis 2028, ca. 6 %","von":420,"bis":690},{"posten":"Puffer ca. 10 %","von":750,"bis":1220}],"risiken":[{"risiko":"Budget: Drei Unterkünfte mit Pool in Italien zur Hochsaison kosten mehr als Villen in Asien. Realistische Mitte ca. 10.400 €, also über 8.500 € (Schätzung).","gegenmassnahme":"Sparhebel 1: in Noto Villa Manghisi (ab 170 €/Nacht) statt Villadorata, spart ca. 900 bis 1.300 €. Sparhebel 2: auf Salina Halgoduria statt Signum und das Boot-Dinner als Aperitivo-Tour in kleiner Gruppe, spart ca. 700 bis 1.000 €. Mit beiden ca. 8.200 bis 8.800 € (Schätzung)."},{"risiko":"Wind und Seegang: Tragflügelboote und Bootsabende fallen aus, Liz wird seekrank.","gegenmassnahme":"Salina liegt in der Mitte der Reise, nicht am Abflugtag. Tag 8 und 9 sind tauschbar. Mittel gegen Seekrankheit vorher klären, Plätze hinten in der Mitte wählen."},{"risiko":"Ätna-Ausbruch oder Aschewolke: Flughafen Catania schließt zeitweise, Gipfeltouren werden gesperrt.","gegenmassnahme":"Flexibler Tarif, Palermo als Ausweichflughafen (ca. 2,5 bis 3 h Fahrt, Schätzung), Versicherung mit Reiseabbruch. Plan B für den Ätna-Abend siehe unten."},{"risiko":"Hitzewelle mit Scirocco und Fahrstress auf Siziliens Straßen.","gegenmassnahme":"Programm früh am Morgen und am Abend, mittags Pool. Kleines Auto, Vollkasko ohne Selbstbeteiligung, nur ein langer Fahrtag."}],"plan_b":"Fällt die Stromboli-Bootsfahrt aus (Wind, Vulkanaktivität, Sperrung): Sonnenuntergang vom Aussichtspunkt über Pollara und Dinner in Malfa, oder Bootsabend um Salina an einem ruhigeren Tag. Fällt der Ätna-Abend aus: Weinprobe am Nordhang und Alcantara-Schlucht. Fällt das Privatboot-Dinner aus: Dinner auf der Hotelterrasse mit Sonnenuntergangsblick Richtung Pollara und das Boot an Tag 9 nachholen.","quellen":[{"titel":"Auswärtiges Amt: Italien, Reise- und Sicherheitshinweise","url":"https://www.auswaertiges-amt.de/de/service/laender/italien-node/italiensicherheit-211322","stand":"2026-11-07"},{"titel":"Direktflug.de: Frankfurt nach Catania","url":"https://www.direktflug.de/ab-frankfurt/nach-catania/","stand":"2026-11-07"},{"titel":"I Castelli: Mantàri Eco Lodges","url":"https://www.icastelli.net/en/mantari-eco-lodges","stand":"2026-11-07"},{"titel":"I Castelli: Zash Country Boutique Hotel, Zimmer","url":"https://www.icastelli.net/en/zash-country-boutique-hotel/redirect/rooms","stand":"2026-11-07"},{"titel":"I Castelli: Zimmer und Suiten mit Privatpool in Sizilien","url":"https://www.icastelli.net/en/theme-stay/rooms-and-suites-with-private-pool/italy/sicily","stand":"2026-11-07"},{"titel":"Mr & Mrs Smith: Hotel Signum, Zimmer","url":"https://www.mrandmrssmith.com/luxury-hotels/hotel-signum/rooms","stand":"2026-11-07"},{"titel":"I Castelli: Halgoduria, Salina","url":"https://www.icastelli.net/it/halgoduria","stand":"2026-11-07"},{"titel":"Welcome Beyond: Country House Villadorata","url":"https://www.welcomebeyond.com/property/country-house-villadorata/","stand":"2026-11-07"},{"titel":"Welcome Beyond: Braccialieri","url":"https://www.welcomebeyond.com/property/braccialieri/","stand":"2026-11-07"},{"titel":"Isula Travel: Villa Manghisi, Noto","url":"https://www.isulatravel.com/villa-manghisi-noto?page=0","stand":"2026-11-07"},{"titel":"Wassertemperatur.org: Klima Catania","url":"https://www.wassertemperatur.org/?p=33440","stand":"2026-11-07"},{"titel":"INGV CME: Verordnung Nr. 16/2025 der Gemeinde Lipari zum Zugang zum Stromboli (über Suche gefunden, genaue Unterseite nicht gespeichert)","url":"https://cme.ingv.it","stand":"2026-11-07"}]},{"id":"E","titel":"Bali und Komodo","untertitel":"Reisterrassen und Privatpool in Sidemen, dann Meerblick-Villa auf Flores und ein Tag auf dem Boot zu Padar, Pink Beach und den Komodowaranen.","farbe":"#F26B5B","hero":{"url":"https://images.unsplash.com/photo-1508920005420-82c189673623?w=1600&q=80","credit":"Ash Edmonds, Unsplash License","quelle":"https://unsplash.com/photos/j0qd1HMMB8c"},"eckdaten":{"monat":"Juni 2028","naechte":14,"budget_von":6800,"budget_bis":10100,"budget_mitte":8450,"ampel":"eng","anreise":"Do Nachtflug Frankfurt–Singapur nonstop (Singapore Airlines, ca. 21:40 ab, ca. 17:00 an, ca. 12 h 20; Stand Winterflugplan 2026, recherchiert). Weiter mit Inlandsflügen Singapur–Bali und Bali–Labuan Bajo, zurück per Direktflug Labuan Bajo–Singapur (Scoot, Do und So, recherchiert) und Tagflug Singapur–Frankfurt.","zeitverschiebung":"+6 h (Singapur, Bali und Flores, im Juni gegenüber MESZ; Schätzung)","stopover":"Singapur (2 Nächte auf dem Hinweg, 1 Nacht auf dem Rückweg)"},"stationen":[{"name":"Singapur","land":"Singapur","naechte":3,"lat":1.3521,"lon":103.8198,"unterkunft":"Stadthotel mit Pool, 2 Nächte am Anfang, 1 Nacht beim Rückflug am Flughafen","beispiele":[{"name":"Hotel nahe Marina Bay oder Chinatown (Beispiel, noch offen)","warum":"Kurze Wege zu Gardens by the Bay und Märkten, Klimaanlage, Pool zum Ankommen.","preis":"ca. 180 bis 280 €/Nacht (Schätzung)","url":""},{"name":"Crowne Plaza Changi Airport (Beispiel für die Rückflugnacht)","warum":"Direkt am Terminal, Jewel zu Fuß erreichbar, kein Stress vor dem Frühflug.","preis":"ca. 180 bis 260 €/Nacht (Schätzung)","url":""}]},{"name":"Sidemen (Ost-Bali)","land":"Indonesien","naechte":5,"lat":-8.4666,"lon":115.46,"unterkunft":"Privatpool-Villa zwischen Reisterrassen mit Blick auf den Mount Agung","beispiele":[{"name":"Umah Dewi Sri","warum":"Laut Drittportal nur für Erwachsene, Infinity-Pool, Reisfelder, Agung in der Ferne. Ob der Pool privat ist, beim Haus erfragen.","preis":"Preis offen, Richtwert ca. 120 bis 200 €/Nacht (Schätzung)","url":""},{"name":"Villa Sidemen","warum":"Sechs Villen, laut Hotelliste jeweils mit Privatpool, romantischer Agung-Blick.","preis":"Preis offen, Richtwert ca. 130 bis 220 €/Nacht (Schätzung)","url":""},{"name":"Wapa di Ume Sidemen","warum":"Bekanntes Resort mit Pool Villa.","preis":"Stichproben ca. 118 bis 250 € (recherchiert, streut stark, kein sauberer Villenpreis)","url":""}]},{"name":"Labuan Bajo (Flores)","land":"Indonesien","naechte":6,"lat":-8.4967,"lon":119.8887,"unterkunft":"Villa mit Meerblick, möglichst mit Privatpool und eigenem Strandzugang","beispiele":[{"name":"Plataran Komodo Resort & Spa","warum":"Nur 18 Villen, Waecicu Beach, Sonnenuntergang am Atlantis on the Rock. Höhere Kategorien haben Privatpool, ob mit Meerblick, beim Haus erfragen.","preis":"ab ca. 400 USD/Nacht laut Reiseführer (recherchiert, Drittquelle)","url":"https://guide.michelin.com/hr/en/hotels-stays/labuan-bajo/plataran-komodo-resort-spa-8679"},{"name":"TA'AKTANA, a Luxury Collection Resort & Spa","warum":"Pool-Villen mit Meer- oder Teilmeerblick laut Buchungsportalen, Angaben widersprechen sich.","preis":"Preis nicht belegt, Richtwert 250 bis 450 € (Schätzung)","url":""},{"name":"Villa Domanik","warum":"Infinity-Pool mit Meer- und Grünblick, günstigere Alternative zu den Resorts.","preis":"Preis offen, Richtwert 150 bis 250 € (Schätzung)","url":""}]}],"wege":[{"von":"Frankfurt","nach":"Singapur","art":"Flug","dauer":"ca. 12 h 20 nonstop, Nachtflug (recherchiert)"},{"von":"Singapur","nach":"Denpasar (Bali)","art":"Flug","dauer":"ca. 2 h 45 (Schätzung)"},{"von":"Flughafen Denpasar","nach":"Sidemen","art":"Auto","dauer":"ca. 1,5 bis 2 h mit Privatfahrer (Schätzung)"},{"von":"Denpasar","nach":"Labuan Bajo","art":"Flug","dauer":"ca. 1 h 5 bis 1 h 20 (recherchiert)"},{"von":"Labuan Bajo","nach":"Singapur","art":"Flug","dauer":"ca. 3 h 30, Scoot, Do und So (recherchiert, Stand 2026)"},{"von":"Singapur","nach":"Frankfurt","art":"Flug","dauer":"ca. 13 h Tagflug (Schätzung)"}],"tage":[{"tag":1,"ort":"Frankfurt","titel":"Abflug in den Abend","energie":"ruhig","text":"Ihr fliegt am Donnerstagabend nonstop nach Singapur. Das ist euer erster Langstreckenflug, und ein Nachtflug ist dafür die sanfteste Variante. Mit Nackenhörnchen, Schlafmaske und Gang-Fensterplätzen schlaft ihr zumindest ein paar Stunden.","highlights":["Nonstop, kein Umstieg","Hochzeitsabend ausklingen lassen"],"tipp":"Gang und Fenster für zwei buchen, der Mittelplatz bleibt oft frei (Annahme). Der Donnerstag ist wichtig, weil der Rückflug Labuan Bajo–Singapur nur Do und So geht.","bild":{"url":"https://images.unsplash.com/photo-1759784839707-a32c910a7747?w=1600&q=80","credit":"benjamin lehman, Unsplash License","quelle":"https://unsplash.com/photos/airplane-wing-seen-through-window-above-clouds-gYe2GTSKlk0"}},{"tag":2,"ort":"Singapur","titel":"Ankommen mit leichtem Abend","energie":"ruhig","text":"Ihr landet am späten Nachmittag und seid gegen 18 Uhr im Hotel. Duschen, kurzer Poolgang. Am Abend geht ihr langsam durch Gardens by the Bay zu den Supertrees und esst danach im Hawker Centre mild, zum Beispiel Hainan-Hähnchenreis.","highlights":["Supertree-Spaziergang bei Dämmerung","Mildes Essen: Hainan-Hähnchenreis, Satay ohne Chili"],"tipp":"SG Arrival Card bis 3 Tage vor Ankunft online ausfüllen (recherchiert, auf ica.gov.sg prüfen). Nicht länger wach bleiben als bis 21 Uhr.","bild":{"url":"https://images.unsplash.com/photo-1508964942454-1a56651d54ac?w=1600&q=80","credit":"Coleen Rivas, Unsplash License","quelle":"https://unsplash.com/photos/supertrees-at-gardens-by-the-bay-singapore-OZ2rS2zCjNo"}},{"tag":3,"ort":"Singapur","titel":"Stadt im Schongang","energie":"mittel","text":"Vormittags besucht ihr die klimatisierten Gewächshäuser (Cloud Forest und Flower Dome) in Gardens by the Bay, mittags geht es in die Pool-Pause. Am späten Nachmittag schlendert ihr durch Chinatown oder den Markt am Tekka Centre. Das Wetter ist heiß und feucht, plant daher Pausen im Kühlen ein.","highlights":["Gewächshäuser statt Mittagshitze","Markt und Hawker-Abendessen","Pool im Hotel"],"tipp":"Eintrittstickets vorab online buchen, damit ihr nicht anstehen müsst. Früh zu Bett für Tag 4.","bild":{"url":"https://images.unsplash.com/photo-1508964942454-1a56651d54ac?w=1600&q=80","credit":"Coleen Rivas, Unsplash License (Wiederholung, Symbolbild für Singapur)","quelle":"https://unsplash.com/photos/supertrees-at-gardens-by-the-bay-singapore-OZ2rS2zCjNo"}},{"tag":4,"ort":"Sidemen","titel":"Weiterflug nach Bali und Reisterrassen","energie":"mittel","text":"Morgens fliegt ihr nach Denpasar. Dort wartet ein Privatfahrer, die Fahrt nach Sidemen dauert etwa 1,5 bis 2 Stunden. Beim Einchecken wartet die Villa mit eigenem Pool und Blick über die Terrassen. Den Rest des Tages tut ihr nichts.","highlights":["Privatfahrer statt Taxi-Chaos","Villa-Check-in und erster Sprung in den Pool"],"tipp":"Visum bei Ankunft (500.000 IDR p. P.) vorab als e-VOA online beantragen, so spart ihr die Schlange. Zusätzlich die Bali-Abgabe (150.000 IDR p. P.) über „Love Bali“ zahlen (alles bestätigt, Auswärtiges Amt, Stand 2026).","bild":{"url":"https://images.unsplash.com/photo-1786882549422-b92e6016798a?w=1600&q=80","credit":"Rowan Heuvel, Unsplash License","quelle":"https://unsplash.com/photos/blue-hut-in-green-rice-terrace-Ajp5k1-CGhE"}},{"tag":5,"ort":"Sidemen","titel":"Frühstück am Pool, sonst nichts","energie":"ruhig","text":"Ausschlafen, langes Frühstück am eigenen Pool mit Blick ins Grün, später eine Balinesische Massage im Haus oder im nahen Spa. Am Nachmittag schaut ihr beim Spaziergang durch die Dorfgassen, wie die Reisbauern arbeiten.","highlights":["Frühstück am eigenen Pool","Massage ab ca. 15 € p. P. (Schätzung)","Sonnenuntergang an der Terrasse"],"tipp":"Die Villa um Moskitonetz, Klimaanlage und Insektenspray bitten, Abendessen drinnen oder mit Räucherspirale buchen.","bild":{"url":"https://images.unsplash.com/photo-1668854085665-0eed599e8078?w=1600&q=80","credit":"Polina Kuzovkova, Unsplash License (Symbolbild: Bali-Villa mit Pool)","quelle":"https://unsplash.com/photos/a-small-pool-in-a-tropical-area-ZkcfXySL_18"}},{"tag":6,"ort":"Sidemen","titel":"Reisterrassen im Morgenlicht","energie":"mittel","text":"Früher Start Nummer eins: Gegen 6 Uhr geht ihr mit einem Guide durch die Terrassen, während die Sonne über dem Agung aufgeht. Es ist ein gemütlicher Weg von etwa 1,5 Stunden, kein Berganstieg. Danach gibt es Frühstück und den Rest des Tages Pool.","highlights":["Mount Agung im ersten Licht","Guide mit Spaziergang durch die Felder"],"tipp":"Der Agung ist ein aktiver Vulkan, hinauf geht ihr nicht, aber die Aussicht gibt es gratis. Auf frühe Morgenstunden Mücken achten, lange Kleidung.","bild":{"url":"https://images.unsplash.com/photo-1558005530-a7958896ec60?w=1600&q=80","credit":"Geio Tischler, Unsplash License","quelle":"https://unsplash.com/photos/person-walking-through-green-rice-terraces-7hww7t6NLcg"}},{"tag":7,"ort":"Sidemen","titel":"Wasserpalast Tirta Gangga","energie":"mittel","text":"Ihr fahrt rund 30 bis 45 Minuten (Schätzung) nach Tirta Gangga und seid kurz nach der Öffnung da, bevor die Reisebusse kommen. Zwischen Fischteichen und Fontänen entstehen eure Paarfotos. Mittags seid ihr zurück bei eurem Pool.","highlights":["Früh am Tag, wenig Andrang","Fischteiche und Steinfiguren als Fotospots"],"tipp":"Auf die Nutzung der Becken (Baden) achten, nur in den erlaubten Bereichen. Ab 10 Uhr wird es voll.","bild":{"url":"https://images.unsplash.com/photo-1687859846973-56a5894530bf?w=1600&q=80","credit":"René Riegal, Unsplash License","quelle":"https://unsplash.com/photos/a-pond-with-a-fountain-surrounded-by-fish-MNIFBeovrNE"}},{"tag":8,"ort":"Sidemen","titel":"Kochkurs und Opfergaben","energie":"ruhig","text":"Vormittags macht ihr einen Kochkurs bei einer Familie im Dorf. Ihr bittet vorab um milde Gerichte ohne Chili und lernt zum Beispiel Nasi Goreng und Gemüsecurry. Nachmittags bastelt ihr Opfergaben (Canang Sari) und lasst den Tag im Pool ausklingen.","highlights":["Kochkurs mild, ohne Chili","Blumen-Opfergaben selbst legen","Letzter Abend in Sidemen"],"tipp":"Beim Buchen ausdrücklich „no chili“ angeben und beim Anbieter gegenfragen, ob die Sambal separat serviert wird.","bild":{"url":"https://images.unsplash.com/photo-1565970141239-7836886ade57?w=1600&q=80","credit":"Nick Fewings, Unsplash License (Symbolbild: Blumen-Opfergaben, aufgenommen am Tirta Empul)","quelle":"https://unsplash.com/photos/assorted-flowers-JCWt72QbGo4"}},{"tag":9,"ort":"Labuan Bajo","titel":"Inlandsflug nach Flores","energie":"mittel","text":"Ihr fahrt zum Flughafen Denpasar und fliegt in gut einer Stunde nach Labuan Bajo. Der Transfer zur Villa dauert 15 bis 30 Minuten (Schätzung). Am Nachmittag richtet ihr euch ein, abends trinkt ihr einen Sundowner mit Blick auf die Inseln.","highlights":["Flug nur ca. 1 h 10","Sonnenuntergang über dem Meer"],"tipp":"Den Flug früh am Tag wählen und mit Puffer planen, Inlandsflüge sind oft verspätet. Aufgegebenes Gepäck auf maximal 20 kg pro Person begrenzen (Annahme, bei der Airline prüfen).","bild":{"url":"https://images.unsplash.com/photo-1736045507214-382dfbbcf927?w=1600&q=80","credit":"Simon Spring, Unsplash License","quelle":"https://unsplash.com/photos/a-palm-tree-on-a-hill-overlooking-the-ocean-e9AM0jVQz7A"}},{"tag":10,"ort":"Labuan Bajo","titel":"Villa, Meerblick, Spa","energie":"ruhig","text":"Ihr schlaft aus, frühstückt am Pool mit Blick aufs Meer und geht danach in den Spa. Am Nachmittag ist Strandzeit, abends gibt es das erste Dinner bei Sonnenuntergang. So tankt ihr Kraft für den großen Bootstag.","highlights":["Frühstück am Pool mit Meerblick","Spa-Behandlung","Dinner bei Sonnenuntergang"],"tipp":"Für morgen: Das Boot am besten schon heute über das Hotel oder einen bewerteten Anbieter bestätigen, mit Schwimmwesten und zweitem Motor.","bild":{"url":"https://images.unsplash.com/photo-1540541338287-41700207dee6?w=1600&q=80","credit":"Paolo Nicolello, Unsplash License (Symbolbild: Pool am Meer)","quelle":"https://unsplash.com/photos/swimming-pool-near-ocean-2gOxKj594nM"}},{"tag":11,"ort":"Labuan Bajo","titel":"Bootstag: Padar, Pink Beach, Komodowarane","energie":"aktiv","text":"Ihr fahrt mit einem privaten Speedboat für einen Tag in den Nationalpark. Padar, Pink Beach, Schnorcheln und eine kurze Wanderung mit Rangern zu den Komodowaranen auf Rinca oder Komodo stehen auf dem Programm. Die Fahrt dauert insgesamt 11 bis 12 Stunden von Hafen zu Hafen, das ist ein langer Tag, und ihr plant danach den Folgetag als Ruhetag.","highlights":["Padar-Aussicht (Aufstieg 25 bis 45 Minuten, Treppen)","Pink Beach und Schnorcheln, mit etwas Glück Schildkröten oder Mantas","Komodowarane mit Ranger"],"tipp":"Ein echter Padar-Sonnenaufgang geht nur mit Abholung um ca. 3:30 Uhr (Early Start Nummer zwei). Normale Tagesboote fahren um 5:30 bis 6:00 los und kommen nach Sonnenaufgang an (recherchiert, widersprüchliche Angaben). Eintritt Park 250.000 IDR p. P. und Tag, plus Hafen- und Rangergebühren (recherchiert, Komodoguide Stand Mai 2026), Drohne nicht mitnehmen.","bild":{"url":"https://images.unsplash.com/photo-1724127544059-ad7bae7c66b4?w=1600&q=80","credit":"Takashi Miyazaki, Unsplash License","quelle":"https://unsplash.com/photos/an-aerial-view-of-an-island-in-the-ocean-4pfDusF5_vQ"}},{"tag":12,"ort":"Labuan Bajo","titel":"Ruhetag mit Sonnenuntergang","energie":"ruhig","text":"Ihr tut nichts, außer Pool, Lesen und Massage. Am späten Nachmittag fahrt ihr zu einem Aussichtspunkt über der Bucht oder bleibt auf der Villa-Terrasse. Dieser Tag ist euer Puffer, falls das Boot gestern wetterbedingt ausgefallen ist.","highlights":["Pool und Spa","Sonnenuntergang über den Inseln"],"tipp":"Den Bootstag bei Bedarf auf diesen Tag verschieben, in dem Fall dann Tag 13 als Ruhetag nehmen.","bild":{"url":"https://images.unsplash.com/photo-1589309736404-2e142a2acdf0?w=1600&q=80","credit":"William Kusno, Unsplash License (Symbolbild: Sonnenuntergang über Wasser und Bergen)","quelle":"https://unsplash.com/photos/body-of-water-between-mountains-during-sunset-tq_h8bCNhKQ"}},{"tag":13,"ort":"Labuan Bajo","titel":"Halbtag Schnorcheln mit Schildkröten","energie":"mittel","text":"Mit einem kleinen Boot fahrt ihr am Vormittag zu einer ruhigen Insel nahe Labuan Bajo (zum Beispiel Kanawa) und schnorchelt dort in flachem, klarem Wasser. Schildkröten sind möglich, aber nicht garantiert. Mittags seid ihr zurück in der Villa.","highlights":["Kurze Fahrt, entspanntes Schnorcheln","Eigener Strandmoment ohne Gruppe"],"tipp":"Rettungsweste beim Schnorcheln tragen (Strömung), nie Tiere berühren oder füttern. Reef-sicheren Sonnenschutz verwenden.","bild":{"url":"https://images.unsplash.com/photo-1589634749362-a8ef3056cbe9?w=1600&q=80","credit":"Naja Bertolt Jensen, Unsplash License (Symbolbild, Indonesien)","quelle":"https://unsplash.com/photos/sea-turtle-swimming-in-blue-water-Uu1CtKngEXY"}},{"tag":14,"ort":"Labuan Bajo","titel":"Strandtag und Dinner im Abendlicht","energie":"ruhig","text":"Ein langer Strandtag, entweder am Hotelstrand oder mit einem Boot zu einem einsamen Strand. Am Abend gibt es euer Dinner mit Füßen im Sand und Sonnenuntergang. Es ist euer letzter ganzer Tag auf Flores, nehmt euch Zeit für die Fotos.","highlights":["Einsamer Strand, privates Dinner","Letzter Sonnenuntergang auf Flores"],"tipp":"Das Strand-Dinner früh reservieren, Tische mit Sonnenuntergangsblick sind begrenzt.","bild":{"url":"https://images.unsplash.com/photo-1736478771803-32a5c22645c9?w=1600&q=80","credit":"Simon Spring, Unsplash License","quelle":"https://unsplash.com/photos/two-boats-are-in-the-water-near-a-sandy-beach-LA1JA3zjDdE"}},{"tag":15,"ort":"Singapur","titel":"Direktflug nach Singapur und Jewel","energie":"ruhig","text":"Ihr fliegt am Donnerstag mit Scoot direkt nach Singapur (ca. 3,5 Stunden). Am Abend schaut ihr euch im Jewel den Rain Vortex an und schlaft in Flughafennähe. Eine kleine Abschiedsparty mit mildem Abendessen im Food Court.","highlights":["Direktflug ohne Zwischenstopp","Rain Vortex im Jewel Changi"],"tipp":"Nur 10 kg Handgepäck im Basistarif, aufgegebenes Gepäck (ca. 30 bis 50 SGD pro Strecke) vorab dazubuchen (recherchiert). Fällt der Direktflug aus, geht es über Denpasar (Plan B).","bild":{"url":"https://images.unsplash.com/photo-1765886177901-dc0660c078b7?w=1600&q=80","credit":"Cai Fang, Unsplash License","quelle":"https://unsplash.com/photos/indoor-waterfall-surrounded-by-lush-greenery-and-modern-architecture--IuJKPEdtV4"}},{"tag":16,"ort":"Frankfurt","titel":"Heimflug","energie":"ruhig","text":"Ihr fliegt am Vormittag nonstop zurück nach Frankfurt. Der Rückflug geht bei Tageslicht, und mit sechs Stunden Zeitverschiebung ist der Jetlag nach Westen meist milder. Zuhause ist es früher Abend.","highlights":["Tagflug, leichter Jetlag","Gemeinsames Foto-Album sortieren"],"tipp":"Den Folgetag zuhause frei halten, damit der Körper sich umstellen kann.","bild":{"url":"https://images.unsplash.com/photo-1759784839707-a32c910a7747?w=1600&q=80","credit":"benjamin lehman, Unsplash License (Wiederholung)","quelle":"https://unsplash.com/photos/airplane-wing-seen-through-window-above-clouds-gYe2GTSKlk0"}}],"warum_ihr":["Frühstück am eigenen Pool mit Grünblick: Sidemen mit Privatpool-Villa ab Tag 4, in Labuan Bajo dann mit Meerblick.","Einsamer Strand mit Dinner bei Sonnenuntergang: Tag 14 in Labuan Bajo (Strand-Dinner, Boot zu einer ruhigen Bucht).","Reisterrassen und Vulkanblick: Sidemen liegt abseits des Süd-Bali-Trubels, Agung-Sonnenaufgang ohne Gipfelaufstieg.","Schnorcheln mit Schildkröten, plus Komodowarane und Padar als echtes Abenteuer, aber auf einen Bootstag begrenzt.","Kochkurs, Spa und Tempel- oder Wasserpalast-Tag: Wünsche aus dem Reiseprofil sind eingeplant.","Nur drei Orte, abwechselnd aktive und faule Tage, keine Zeltnacht, höchstens zwei frühe Starts (Tag 6, optional Tag 11)."],"liz_check":{"langstrecke":"Nur ein Langstreckenflug pro Richtung, nonstop ohne Umstieg: Hinflug nachts ab Frankfurt, Rückflug am Tag. Danach nur kurze Flüge von ca. 1 bis 3,5 Stunden. Singapur als Stopover bricht den Jetlag zusätzlich auf.","insekten":"Ehrlich: Insektenfrei ist in Bali und Flores nicht möglich, Juni ist aber Trockenzeit und damit weniger Mückenzeit (Schätzung). Villa mit Klimaanlage, Moskitonetz und Spray. Dengue-Risiko in Bali besteht, Malaria im Bezirk um Labuan Bajo laut Reiseblog nicht lokal übertragen (nicht offiziell belegt). Details an Gesundheit und Tropeninstitut.","essen":"Balinesisch und indonesisch ist oft scharf. Ihr bittet überall um „tidak pedas“ (nicht scharf). Es gibt viele milde Gerichte (Nasi Goreng, Satay, Hähnchenreis in Singapur). Sambal wird meist separat gereicht.","trubel":"Singapur ist voll, aber geordnet, mit Pausen im Hotel. Sidemen ist ruhig. Labuan Bajo ist touristischer, und die Padar-Aussicht ist beliebt und im Juni deutlich ruhiger als im Juli und August. Ein Privatboot und früher Start reduzieren Menschenmassen."},"wetter":{"juni":"Trockenzeit. Labuan Bajo ca. 30 °C tags und 20 °C nachts, selten Regen (recherchiert, klima.org und Urlaubstracker). Bali ca. 28 bis 30 °C (Schätzung). Singapur ganzjährig heiß, feucht und mit kurzen Schauern (Schätzung). Südostpassat setzt ein, die See kann am Nachmittag rauer werden.","juli":"Hochsaison für Manta-Begegnungen (Quellen widersprechen sich), mehr Andrang. Stärkerer Südostwind: Im Juli 2026 wurde die Schifffahrt zu Padar und Komodo mehrfach wegen Wetters gesperrt (recherchiert, Detik). Sommerferien NRW ab 10.07., Flüge und Unterkünfte teurer.","august":"Peak-Saison, Wind bis ca. 24 Knoten und Wellen bis 2,4 m im August 2026, Sperrungen vom 5. bis 10.08.2026 (recherchiert, Detik). Padar
